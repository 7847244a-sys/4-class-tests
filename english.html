<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по английскому языку — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Выберите правильную форму глагола to be: She ... a good pupil.",
        opts: ["am", "is", "are", "be"],
        corr: 1,
        facts: "Разбор: Местоимение She (она) употребляется с формой глагола is. Am используется с I, are — с we/you/they."
    },
    {
        q: "2. Переведите слово «яблоко» на английский язык:",
        opts: ["Banana", "Apple", "Orange", "Pear"],
        corr: 1,
        facts: "Разбор: Apple — яблоко. Banana — банан, Orange — апельсин, Pear — груша."
    },
    {
        q: "3. Какое из этих слов является множественным числом для слова «child» (ребенок)?",
        opts: ["Childs", "Children", "Childrens", "Childes"],
        corr: 1,
        facts: "Разбор: Слово child — исключение. Множественное число образуется путем добавления окончания -ren: children."
    },
    {
        q: "4. Выберите правильное местоимение: Look at ...! He is swimming.",
        opts: ["he", "his", "him", "himself"],
        corr: 2,
        facts: "Разбор: После предлога (at) используется объектное местоимение him (на него)."
    },
    {
        q: "5. Как переводится предложение: «I have got a red cat»?",
        opts: ["У меня есть рыжая кошка", "У меня есть красная кошка", "Я вижу рыжую кошку", "У меня была кошка"],
        corr: 0,
        facts: "Разбор: В английском языке слово red в отношении животных обозначает рыжий цвет."
    },
    {
        q: "6. Выберите глагол в Present Continuous (настоящее длительное время):",
        opts: ["reads", "readed", "is reading", "will read"],
        corr: 2,
        facts: "Разбор: Present Continuous образуется с помощью формы to be (am/is/are) + глагол с окончанием -ing."
    },
    {
        q: "7. Какое слово лишнее в этой группе?",
        opts: ["Monday", "Tuesday", "Summer", "Friday"],
        corr: 2,
        facts: "Разбор: Summer (лето) — это время года. Остальные слова — дни недели (понедельник, вторник, пятница)."
    },
    {
        q: "8. Вставьте пропущенный предлог: We go to school ... 8 o'clock.",
        opts: ["in", "on", "at", "under"],
        corr: 2,
        facts: "Разбор: Для указания точного времени на часах всегда используется предлог at."
    },
    {
        q: "9. Какой числительное означает «тринадцать»?",
        opts: ["Three", "Thirteen", "Thirty", "Third"],
        corr: 1,
        facts: "Разбор: Thirteen — 13. Three — 3, Thirty — 30, Third — третий."
    },
    {
        q: "10. Выберите правильную форму прошедшего времени (Past Simple) для глагола «go»:",
        opts: ["goed", "went", "gone", "going"],
        corr: 1,
        facts: "Разбор: Go — неправильный глагол. Вторая форма прошедшего времени — went."
    },
    {
        q: "11. Какое из этих слов означает «погода»?",
        opts: ["Winter", "Season", "Weather", "Water"],
        corr: 2,
        facts: "Разбор: Weather — погода. Winter — зима, Season — время года, Water — вода."
    },
    {
        q: "12. Найдите антоним (противоположное по смыслу слово) к слову «big»:",
        opts: ["Small", "Large", "Tall", "Long"],
        corr: 0,
        facts: "Разбор: Big (большой) — Small (маленький). Large — крупный, Tall — высокий, Long — длинный."
    },
    {
        q: "13. Вставьте правильный артикль: I can see ... elephant at the zoo.",
        opts: ["a", "an", "the", "—"],
        corr: 1,
        facts: "Разбор: Перед словами, начинающимися с гласного звука (e - elephant), используется неопределенный артикль an."
    },
    {
        q: "14. Выберите верный вариант: There ... a book and two pens on the table.",
        opts: ["is", "are", "am", "be"],
        corr: 0,
        facts: "Разбор: В конструкции There is/are глагол согласуется с первым существительным после него (a book — единственное число -> is)."
    },
    {
        q: "15. Как правильно сказать по-английски «Солнце светит ярко»?",
        opts: ["The sun shines brightly", "Sun shine bright", "The sun is shine bright", "A sun shines brightly"],
        corr: 0,
        facts: "Разбор: Единственный в своем роде объект (Солнце) требует артикля The, глагол в 3-м лице получаeт -s (shines), а наречие — -ly (brightly)."
    },
    {
        q: "16. Выберите правильное вопросительное слово: ... is your name?",
        opts: ["Who", "What", "Where", "When"],
        corr: 1,
        facts: "Разбор: Что / Как — What. Фраза «What is your name?» переводится как «Как тебя зовут?»."
    },
    {
        q: "17. Какое из следующих существительных является неисчисляемым?",
        opts: ["Apple", "Book", "Milk", "Dog"],
        corr: 2,
        facts: "Разбор: Milk (молоко) нельзя посчитать штуками. Яблоки, книги и собак посчитать можно."
    },
    {
        q: "18. Как сказать «лучший» по-английски?",
        opts: ["Good", "Better", "Best", "The best"],
        corr: 3,
        facts: "Разбор: Превосходная степень прилагательного good (хороший) — the best (самый лучший)."
    },
    {
        q: "19. Переведите: «They are playing football now».",
        opts: ["Они играли в футбол", "Они играют в футбол сейчас", "Они будут играть в футбол", "Они любят футбол"],
        corr: 1,
        facts: "Разбор: Конструкция are playing указывает на действие, происходящее прямо сейчас (Present Continuous)."
    },
    {
        q: "20. Какое слово переводится как «завтрак»?",
        opts: ["Lunch", "Dinner", "Supper", "Breakfast"],
        corr: 3,
        facts: "Разбор: Breakfast — завтрак. Lunch — обед, Dinner/Supper — ужин."
    },
    {
        q: "21. Найдите правильное отрицание для предложения: He likes apples.",
        opts: ["He not likes apples", "He don't like apples", "He doesn't like apples", "He doesn't likes apples"],
        corr: 2,
        facts: "Разбор: Для 3-го лица (he/she/it) в Present Simple отрицание образуется с помощью doesn't + смысловой глагол без окончания (like)."
    },
    {
        q: "22. Как пишется числительное «80»?",
        opts: ["Eighteen", "Eighty", "Eight", "Eighth"],
        corr: 1,
        facts: "Разбор: Eighty — 80. Eighteen — 18, Eight — 8."
    },
    {
        q: "23. Выберите правильно записанную дату: «5 мая»",
        opts: ["5 May", "The fifth of May", "May five", "The five May"],
        corr: 1,
        facts: "Разбор: Порядковые числительные с датами употребляются с артиклем the и предлогом of: The fifth of May."
    },
    {
        q: "24. Какая буква пропущена в слове: W _ n t e r (зима)?",
        opts: ["a", "e", "i", "o"],
        corr: 2,
        facts: "Разбор: Слово «зима» по-английски пишется Winter."
    },
    {
        q: "25. Выберите верный модальный глагол: You ... cross the street when the light is red.",
        opts: ["must", "mustn't", "can", "should"],
        corr: 1,
        facts: "Разбор: Mustn't означает категорический запрет: «Нельзя переходить дорогу на красный свет»."
    },
    {
        q: "26. Переведите словосочетание «in front of»:",
        opts: ["За", "Рядом с", "Перед", "Под"],
        corr: 2,
        facts: "Разбор: In front of — перед чем-то/кем-то. Behind — за, Under — под, Next to — рядом с."
    },
    {
        q: "27. Какое из этих слов обозначает профессию?",
        opts: ["Doctor", "Hospital", "Medicine", "Sick"],
        corr: 0,
        facts: "Разбор: Doctor — врач (профессия). Hospital — больница, Medicine — лекарство, Sick — больной."
    },
    {
        q: "28. Как сказать «сегодня теплая погода»?",
        opts: ["It is warm today", "It was warm today", "It is cold today", "It will be warm today"],
        corr: 0,
        facts: "Разбор: Warm — теплый. Cold — холодный. Настоящее время выражается конструкцией It is..."
    },
    {
        q: "29. Выберите правильную форму прошедшего времени для глагола «see»:",
        opts: ["seed", "saw", "seen", "seeing"],
        corr: 1,
        facts: "Разбор: See (видеть) — неправильный глагол. Форма прошедшего времени (Past Simple) — saw."
    },
    {
        q: "30. Как переводится «Good night!»?",
        opts: ["Доброе утро!", "Добрый день!", "Добрый вечер!", "Спокойной ночи!"],
        corr: 3,
        facts: "Разбор: Good night — Спокойной ночи! Good morning — Доброе утро, Good afternoon — Добрый день, Good evening — Добрый вечер."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаешь английский язык! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
