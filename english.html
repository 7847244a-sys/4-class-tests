<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по английскому языку (4 класс)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 20px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }

        .question-box {
            font-size: 22px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.4;
        }

        .audio-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s;
        }

        .audio-btn:active {
            transform: scale(0.92);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .option-btn .btn-text {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #48bb78 !important;
            color: #1c4527 !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #f56565 !important;
            color: #63171b !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .result-box {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 16px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }

        .result-box.visible {
            display: block;
        }

        .result-title {
            font-weight: 700;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nav-btn-prev {
            background-color: #e2e8f0;
            color: #475569;
        }

        .nav-btn-next {
            background-color: #3b82f6;
            color: white;
            margin-left: auto;
            visibility: hidden;
        }

        .nav-btn-next.visible {
            visibility: visible;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .final-screen.visible {
            display: block;
        }

        .final-title {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 24px;
            background-color: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.8s ease-in-out;
        }

        .score-text {
            font-size: 20px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 16px;
        }

        .feedback-msg {
            font-size: 18px;
            line-height: 1.5;
            color: #475569;
            margin-bottom: 30px;
            padding: 16px;
            border-radius: 12px;
            background-color: #f1f5f9;
        }

        .restart-btn {
            background-color: #10b981;
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Игровой интерфейс -->
    <div id="quiz-screen">
        <div class="header">
            <span id="counter">Вопрос 1 из 30</span>
        </div>

        <div class="question-box">
            <button class="audio-btn" id="q-speech-btn" onclick="speakQuestionText()">🔊</button>
            <span id="question-text"></span>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Кнопки создаются через JS -->
        </div>

        <div class="result-box" id="result-box">
            <div class="result-title">💡 Разбор задания:</div>
            <div id="result-text"></div>
        </div>

        <div class="nav-footer">
            <button class="nav-btn nav-btn-prev" id="prev-btn" onclick="prevQuestion()">← Назад</button>
            <button class="nav-btn nav-btn-next" id="next-btn" onclick="nextQuestion()">Дальше →</button>
        </div>
    </div>

    <!-- Финальный экран -->
    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        
        <div class="score-text" id="score-text">Правильных ответов (с 1 попытки): 0 из 30</div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>

        <div class="feedback-msg" id="feedback-msg"></div>

        <button class="restart-btn" onclick="restartQuiz()">Пройти заново 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "He ... to school every day.",
            opts: ["go", "goes", "going", "went"],
            corr: 1,
            facts: "С he/she/it в Present Simple добавляется -s/-es. Every day - маркер настоящего времени."
        },
        {
            q: "Как переводится слово \"Wednesday\"?",
            opts: ["Понедельник", "Вторник", "Среда", "Пятница"],
            corr: 2,
            facts: "Monday-пон., Tuesday-вторник, Wednesday-среда, Friday-пятница."
        },
        {
            q: "Какое местоимение переводится как \"Она\"?",
            opts: ["He", "She", "It", "They"],
            corr: 1,
            facts: "He-он, She-она, It-оно, They-они."
        },
        {
            q: "I have got ... apple.",
            opts: ["a", "an", "the", "-"],
            corr: 1,
            facts: "Артикль an ставится перед существительными в ед.ч., начинающимися с гласного звука."
        },
        {
            q: "Какое числительное переводится как \"12\"?",
            opts: ["Two", "Ten", "Twelve", "Twenty"],
            corr: 2,
            facts: "two-2, ten-10, twelve-12, twenty-20."
        },
        {
            q: "Переведите слово \"Семья\":",
            opts: ["Friend", "Family", "House", "Mother"],
            corr: 1,
            facts: "friend-друг, family-семья, house-дом, mother-мама."
        },
        {
            q: "They ... happy.",
            opts: ["am", "is", "are", "was"],
            corr: 2,
            facts: "Для множественного числа (they, we, you) в настоящем времени используется are."
        },
        {
            q: "На какой вопрос отвечает слово \"Where\"?",
            opts: ["Что?", "Когда?", "Где?", "Почему?"],
            corr: 2,
            facts: "What-что, When-когда, Where-где/куда, Why-почему."
        },
        {
            q: "Множественное число слова \"Cat\":",
            opts: ["Cats", "Cat", "Cates", "Mice"],
            corr: 0,
            facts: "Множественное число образуется окончанием -s. Mice-мыши (исключение)."
        },
        {
            q: "Как переводится \"Good morning\"?",
            opts: ["Добрый вечер", "Добрый день", "Доброе утро", "Привет"],
            corr: 2,
            facts: "Good morning-доброе утро, Good afternoon-добрый день, Good evening-вечер."
        },
        {
            q: "Лишнее слово:",
            opts: ["Apple", "Banana", "Orange", "Tomato"],
            corr: 3,
            facts: "Первые три - сладкие фрукты, а Tomato - овощ."
        },
        {
            q: "Выберите предлог времени: ... 5 o'clock.",
            opts: ["in", "at", "on", "under"],
            corr: 1,
            facts: "С точным временем на часах используется предлог at."
        },
        {
            q: "Как сказать \"Я умею плавать\"?",
            opts: ["I can swim", "I must swim", "I should swim", "I swim"],
            corr: 0,
            facts: "Модальный глагол can означает уметь/мочь. Must-должен, should-следует."
        },
        {
            q: "Прошедшее время (Past Simple) глагола \"Play\":",
            opts: ["Playing", "Played", "Plays", "Play"],
            corr: 1,
            facts: "У правильных глаголов прошедшее время образуется окончанием -ed."
        },
        {
            q: "Как пишется \"Книга\"?",
            opts: ["Pen", "Bag", "Book", "Ruler"],
            corr: 2,
            facts: "pen-ручка, bag-сумка, book-книга, ruler-линейка."
        },
        {
            q: "This is ... book. (Моя книга).",
            opts: ["me", "my", "mine", "I"],
            corr: 1,
            facts: "Притяжательное местоимение my (мой) ставится прямо перед существительным."
        },
        {
            q: "Как переводится слово \"Autumn\"?",
            opts: ["Весна", "Лето", "Осень", "Зима"],
            corr: 2,
            facts: "Spring-весна, Summer-лето, Autumn-осень, Winter-зима."
        },
        {
            q: "Вопрос к фразе \"My name is Tom\":",
            opts: ["How old are you?", "Where are you from?", "What is your name?", "Who are you?"],
            corr: 2,
            facts: "What is your name? перевод как Как тебя зовут?."
        },
        {
            q: "Какое животное переводится как \"Bear\"?",
            opts: ["Лиса", "Волк", "Медведь", "Заяц"],
            corr: 2,
            facts: "fox-лиса, wolf-волк, bear-медведь, hare-заяц."
        },
        {
            q: "Какая из этих букв гласная?",
            opts: ["B", "E", "G", "R"],
            corr: 1,
            facts: "В английском 6 гласных букв (A, E, I, O, U, Y). Буква E - гласная."
        },
        {
            q: "We ... TV yesterday.",
            opts: ["watch", "watched", "watching", "watches"],
            corr: 1,
            facts: "Yesterday (вчера) требует Past Simple, к правильному глаголу добавляем -ed."
        },
        {
            q: "Как переводится слово \"Kitchen\"?",
            opts: ["Спальня", "Кухня", "Ванная", "Гостиная"],
            corr: 1,
            facts: "bedroom-спальня, kitchen-кухня, bathroom-ванная, living room-гостиная."
        },
        {
            q: "Какое слово означает \"Большой\"?",
            opts: ["Small", "Big", "Short", "Long"],
            corr: 1,
            facts: "small-маленький, big-большой, short-короткий/низкий, long-длинный."
        },
        {
            q: "Выберите отрицание: I ... like milk.",
            opts: ["not", "don't", "doesn't", "am not"],
            corr: 1,
            facts: "Отрицание в Present Simple для I строится с помощью don't (do not)."
        },
        {
            q: "Как сказать по-английски \"Спасибо\"?",
            opts: ["Please", "Hello", "Thank you", "Goodbye"],
            corr: 2,
            facts: "please-пожалуйста, hello-привет, thank you-спасибо, goodbye-до свидания."
        },
        {
            q: "Множественное число слова \"Child\":",
            opts: ["Childs", "Children", "Childrens", "Childes"],
            corr: 1,
            facts: "Child - слово-исключение. Во множественном числе меняется на children."
        },
        {
            q: "Как переводится цвет \"Yellow\"?",
            opts: ["Красный", "Синий", "Зелёный", "Жёлтый"],
            corr: 3,
            facts: "red-красный, blue-синий, green-зеленый, yellow-желтый."
        },
        {
            q: "Выберите верное слово: The sun is in the ...",
            opts: ["sky", "ground", "sea", "room"],
            corr: 0,
            facts: "Фраза переводится как \"Солнце в небе\". Sky - это небо."
        },
        {
            q: "Какое слово означает \"Завтрак\"?",
            opts: ["Lunch", "Dinner", "Breakfast", "Food"],
            corr: 2,
            facts: "breakfast-завтрак, lunch-обед, dinner-ужин, food-еда."
        },
        {
            q: "Как переводится фраза \"I am ten\"?",
            opts: ["Мне 5 лет", "Мне 10 лет", "У меня десять книг", "Я иду домой"],
            corr: 1,
            facts: "Глагол to be используется для указания возраста."
        }
    ];

    let currentIndex = 0;
    // Массив состояния ответа для каждого вопроса: null, selectedIndex
    let userAnswers = new Array(questions.length).fill(null);
    // Отслеживание того, был ли ответ правильным с ПЕРВОЙ попытки
    let firstAttemptCorrect = new Array(questions.length).fill(null);

    // Функция проверки наличия английского текста для озвучки
    function isEnglish(text) {
        return /[a-zA-Z]/.test(text);
    }

    // Озвучка английского текста
    function speakText(text, event) {
        if (event) event.stopPropagation();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakQuestionText() {
        const q = questions[currentIndex];
        if (isEnglish(q.q)) {
            speakText(q.q);
        }
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        
        // Счетчик
        document.getElementById('counter').innerText = `Вопрос ${currentIndex + 1} из ${questions.length}`;
        
        // Текст вопроса
        document.getElementById('question-text').innerText = q.q;
        
        // Показ/скрытие кнопки озвучки вопроса
        const qSpeechBtn = document.getElementById('q-speech-btn');
        if (isEnglish(q.q)) {
            qSpeechBtn.style.display = 'inline-flex';
        } else {
            qSpeechBtn.style.display = 'none';
        }

        // Кнопки навигации
        const prevBtn = document.getElementById('prev-btn');
        if (currentIndex === 0) {
            prevBtn.style.visibility = 'hidden';
        } else {
            prevBtn.style.visibility = 'visible';
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentIndex === questions.length - 1) ? 'Завершить 🏁' : 'Дальше →';

        // Варианты ответов
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const hasAnswered = userAnswers[currentIndex] !== null;

        q.opts.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'btn-text';
            textSpan.innerText = optText;

            // Добавление кнопки озвучки к английским вариантам ответа
            if (isEnglish(optText)) {
                const speechBtn = document.createElement('button');
                speechBtn.className = 'audio-btn';
                speechBtn.innerText = '🔊';
                speechBtn.style.width = '32px';
                speechBtn.style.height = '32px';
                speechBtn.style.minWidth = '32px';
                speechBtn.style.fontSize = '14px';
                speechBtn.onclick = (e) => speakText(optText, e);
                textSpan.prepend(speechBtn);
            }

            btn.appendChild(textSpan);

            // Обработка клика
            btn.onclick = () => selectOption(index);

            // Отрисовка состояния, если на вопрос уже отвечали
            if (hasAnswered) {
                btn.disabled = true;
                if (index === q.corr) {
                    btn.classList.add('correct');
                }
                if (index === userAnswers[currentIndex] && index !== q.corr) {
                    btn.classList.add('wrong');
                }
            }

            optionsContainer.appendChild(btn);
        });

        // Отрисовка блока разбора
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');
        
        if (hasAnswered) {
            resultText.innerText = q.facts;
            resultBox.classList.add('visible');
            nextBtn.classList.add('visible');
        } else {
            resultBox.classList.remove('visible');
            nextBtn.classList.remove('visible');
        }
    }

    function selectOption(index) {
        if (userAnswers[currentIndex] !== null) return;

        const q = questions[currentIndex];
        userAnswers[currentIndex] = index;

        // Фиксация первой попытки
        if (firstAttemptCorrect[currentIndex] === null) {
            firstAttemptCorrect[currentIndex] = (index === q.corr);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.corr) {
                btn.classList.add('correct');
            }
            if (idx === index && idx !== q.corr) {
                btn.classList.add('wrong');
            }
        });

        // Автоматическая озвучка правильности или текста ответа (опционально)
        if (isEnglish(q.opts[index])) {
            speakText(q.opts[index]);
        }

        document.getElementById('result-text').innerText = q.facts;
        document.getElementById('result-box').classList.add('visible');
        document.getElementById('next-btn').classList.add('visible');
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            loadQuestion();
        } else {
            showFinalScreen();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function showFinalScreen() {
        document.getElementById('quiz-screen').style.display = 'none';
        
        const finalScreen = document.getElementById('final-screen');
        finalScreen.classList.add('visible');

        // Подсчет баллов с первой попытки
        const score = firstAttemptCorrect.filter(val => val === true).length;
        const total = questions.length;
        const percentage = Math.round((score / total) * 100);

        document.getElementById('score-text').innerText = `Правильных ответов (с 1 попытки): ${score} из ${total}`;
        
        const progressBar = document.getElementById('progress-bar');
        setTimeout(() => {
            progressBar.style.width = percentage + '%';
        }, 100);

        const feedbackMsg = document.getElementById('feedback-msg');

        if (score === 30) {
            feedbackMsg.innerText = "Выполнено на 100%! Ты абсолютный супер-знаток! Поздравляем! 🎉🏆";
            feedbackMsg.style.color = "#15803d";
            feedbackMsg.style.backgroundColor = "#dcfce7";
        } else if (score >= 24) {
            feedbackMsg.innerText = "Выполнено! Отличный результат, ты прекрасно готов к 5 классу! 👍✨";
            feedbackMsg.style.color = "#1d4ed8";
            feedbackMsg.style.backgroundColor = "#dbeafe";
        } else {
            feedbackMsg.innerText = "Не выполнено! Квест пройден не полностью. Попробуй пройти заново, чтобы улучшить свой результат и повторить правила! 💪📚";
            feedbackMsg.style.color = "#b91c1c";
            feedbackMsg.style.backgroundColor = "#fee2e2";
        }
    }

    function restartQuiz() {
        currentIndex = 0;
        userAnswers.fill(null);
        firstAttemptCorrect.fill(null);
        
        document.getElementById('progress-bar').style.width = '0%';
        document.getElementById('final-screen').classList.remove('visible');
        document.getElementById('quiz-screen').style.display = 'block';
        
        loadQuestion();
    }

    // Инициализация при старте
    window.onload = loadQuestion;
</script>

</body>
</html>
