<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по Английскому языку — 4 класс</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #e0f2f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #00695c; font-size: 22px; margin-bottom: 20px; }
        .question { font-size: 18px; margin-bottom: 20px; color: #202124; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 14px; background: #f8f9fa; border: 2px solid #dadce0; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: 600; color: #3c4043; }
        .btn:hover { background: #e0f2f1; border-color: #00695c; }
        .progress-container { background: #e0e0e0; border-radius: 10px; height: 24px; width: 100%; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.4s; }
        .result-score { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .result-details { font-size: 18px; color: #5f6368; margin-bottom: 20px; }
        .verdict { font-size: 18px; font-weight: bold; padding: 15px; border-radius: 10px; }
        .restart-btn { margin-top: 20px; padding: 12px 24px; background: #00695c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔤 Тест по Английскому языку (4 класс)</h1>
    
    <div id="quiz-screen">
        <div class="question" id="q-text">Загрузка вопроса...</div>
        <div class="options" id="opt-container"></div>
    </div>

    <div id="result-screen" style="display: none;">
        <h2>Результат тестирования</h2>
        <div class="progress-container">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
        <div class="result-score" id="percent-text">0%</div>
        <div class="result-details" id="stats-text"></div>
        <div class="verdict" id="verdict-box"></div>
        <button class="restart-btn" onclick="location.reload()">Пройти заново</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Выберите правильную форму глагола: He ___ to school every day.", opts: ["go", "goes", "going", "went"], correct: 1 },
        { q: "Переведите слово «Яблоко»:", opts: ["Banana", "Orange", "Apple", "Pear"], correct: 2 },
        { q: "Вставьте правильное местоимение: Look at ___! She is dancing.", opts: ["her", "him", "them", "its"], correct: 0 },
        { q: "Какое из этих слов обозначает дни недели?", opts: ["Monday", "Summer", "Morning", "March"], correct: 0 },
        { q: "Выберите правильный вопрос: ___ you like ice cream?", opts: ["Does", "Do", "Is", "Are"], correct: 1 }
    ];

    let currentQ = 0;
    let score = 0;

    function renderQuestion() {
        if (currentQ >= questions.length) {
            showResults();
            return;
        }
        let q = questions[currentQ];
        document.getElementById("q-text").innerText = `Вопрос ${currentQ + 1} из ${questions.length}: ${q.q}`;
        let container = document.getElementById("opt-container");
        container.innerHTML = "";
        q.opts.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === q.correct) score++;
                currentQ++;
                renderQuestion();
            };
            container.appendChild(btn);
        });
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        
        let total = questions.length;
        let percent = Math.round((score / total) * 100);
        let errors = total - score;

        document.getElementById("percent-text").innerText = `${percent}%`;
        document.getElementById("stats-text").innerText = `Правильно: ${score} из ${total} | Ошибок: ${errors}`;
        
        let bar = document.getElementById("progress-bar");
        bar.style.width = percent + "%";

        let verdict = document.getElementById("verdict-box");

        if (percent === 100) {
            bar.style.backgroundColor = "#2e7d32";
            verdict.style.backgroundColor = "#e8f5e9";
            verdict.style.color = "#2e7d32";
            verdict.innerText = "🎉 Отлично! Всё выполнено на 100%! Покажи этот экран учителю.";
        } else {
            bar.style.backgroundColor = "#d32f2f";
            verdict.style.backgroundColor = "#ffebee";
            verdict.style.color = "#c62828";
            verdict.innerText = "❌ Задание не выполнено! Нажмите «Пройти заново» и сделайте всё на 100%.";
        }
    }

    renderQuestion();
</script>

</body>
</html>
