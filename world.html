<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по окружающему миру — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Какая планета Солнечной системы находится ближе всего к Солнцу?",
        opts: ["Венера", "Марс", "Меркурий", "Земля"],
        corr: 2,
        facts: "Разбор: Меркурий — самая близкая к Солнцу планета."
    },
    {
        q: "2. Какой материк является самым большим на Земле?",
        opts: ["Африка", "Евразия", "Северная Америка", "Австралия"],
        corr: 1,
        facts: "Разбор: Евразия — крупнейший материк нашей планеты."
    },
    {
        q: "3. Какое озеро является самым глубоким в мире?",
        opts: ["Каспийское море", "Байкал", "Ладожское", "Онежское"],
        corr: 1,
        facts: "Разбор: Озеро Байкал — самое глубокое озеро на планете Земля."
    },
    {
        q: "4. Какой орган человека отвечает за перекачивание крови по организму?",
        opts: ["Лёгкие", "Печень", "Желудок", "Сердце"],
        corr: 3,
        facts: "Разбор: Сердце выполняет функцию насоса, перекачивающего кровь по сосудам."
    },
    {
        q: "5. Как называется природная зона, где преобладают хвойные деревья (ель, сосна, лиственница)?",
        opts: ["Тундра", "Степь", "Тайга", "Пустыня"],
        corr: 2,
        facts: "Разбор: Тайга — это хвойные леса умеренного пояса."
    },
    {
        q: "6. Какой газ из атмосферы мы поглощаем при дыхании?",
        opts: ["Углекислый газ", "Кислород", "Азот", "Водород"],
        corr: 1,
        facts: "Разбор: При дыхании животные и человек усваивают кислород."
    },
    {
        q: "7. Какое звено является первым в любой пищевой цепи?",
        opts: ["Хищники", "Растительноядные животные", "Растения", "Бактерии"],
        corr: 2,
        facts: "Разбор: Цепи питания всегда начинаются с растений (продуцентов)."
    },
    {
        q: "8. В каком состоянии находится вода в виде пара?",
        opts: ["Жидком", "Твёрдом", "Газообразном", "Плазменном"],
        corr: 2,
        facts: "Разбор: Пар — это газообразное состояние воды."
    },
    {
        q: "9. Какой природный объект относится к неживой природе?",
        opts: ["Гриб", "Береза", "Гранит", "Бабочка"],
        corr: 2,
        facts: "Разбор: Гранит — это горная порода, объект неживой природы."
    },
    {
        q: "10. Какое явление природы приводит к смене дня и ночи?",
        opts: ["Вращение Земли вокруг Солнца", "Вращение Земли вокруг своей оси", "Движение Луны вокруг Земли", "Наклон земной оси"],
        corr: 1,
        facts: "Разбор: Смена дня и ночи происходит из-за полного оборота Земли вокруг своей оси за 24 часа."
    },
    {
        q: "11. Какое животное является занесённым в Красную книгу России?",
        opts: ["Амурский тигр", "Бурый медведь", "Заяц-беляк", "Обыкновенная лисица"],
        corr: 0,
        facts: "Разбор: Амурский тигр — редкий вид, находящийся под охраной государств и занесенный в Красную книгу."
    },
    {
        q: "12. Как называется прибор для определения сторон горизонта?",
        opts: ["Термометр", "Барометр", "Компас", "Телескоп"],
        corr: 2,
        facts: "Разбор: Компас — прибор для ориентирования на местности."
    },
    {
        q: "13. Какое полезное ископаемое используется как основное топливо для электростанций и отопления?",
        opts: ["Песок", "Каменный уголь", "Глина", "Известняк"],
        corr: 1,
        facts: "Разбор: Каменный уголь — горючее полезное ископаемое."
    },
    {
        q: "14. Какой орган чувств отвечает за восприятие запахов?",
        opts: ["Глаза", "Уши", "Нос (обоняние)", "Язык"],
        corr: 2,
        facts: "Разбор: Орган обоняния — нос."
    },
    {
        q: "15. Какая природная зона характеризуется холодным климатом и мхами/лишайниками?",
        opts: ["Степь", "Тундра", "Пустыня", "Широколиственный лес"],
        corr: 1,
        facts: "Разбор: В тундре суровый климат, из-за мерзлоты там растут преимущественно мхи, лишайники и карликовые кустарники."
    },
    {
        q: "16. Назовите столицу Российской Федерации:",
        opts: ["Санкт-Петербург", "Новосибирск", "Москва", "Екатеринбург"],
        corr: 2,
        facts: "Разбор: Город Москва — главная столица нашей страны."
    },
    {
        q: "17. Что изучает наука экология?",
        opts: ["Звёзды и планеты", "Взаимоотношения организмов между собой и с окружающей средой", "Прошлое человечества", "Строение человеческого тела"],
        corr: 1,
        facts: "Разбор: Экология — наука об отношениях живых организмов и их сообществ между собой и с окружающей средой."
    },
    {
        q: "18. Какой океан является самым большим и глубоким на Земле?",
        opts: ["Атлантический", "Индийский", "Тихий", "Северный Ледовитый"],
        corr: 2,
        facts: "Разбор: Тихий океан — крупнейший по площади и глубине океан на Земле."
    },
    {
        q: "19. Какой цвет на географической карте обозначает равнины и низменности?",
        opts: ["Синий", "Коричневый", "Зелёный", "Белый"],
        corr: 2,
        facts: "Разбор: Зеленым цветом на физических картах обозначают низменности и равнины."
    },
    {
        q: "20. Какое явление природы происходит из-за конденсации водяного пара вблизи поверхности земли?",
        opts: ["Дождь", "Туман", "Снег", "Град"],
        corr: 1,
        facts: "Разбор: Туман — скопление капелек воды у поверхности земли."
    },
    {
        q: "21. Как называются организмы, создающие органические вещества из неорганических при помощи света?",
        opts: ["Животные", "Растения", "Грибы", "Бактерии-разрушители"],
        corr: 1,
        facts: "Разбор: Зелёные растения в процессе фотосинтеза создают органические вещества."
    },
    {
        q: "22. Какой заповедник в России является одним из старейших и охраняет баргузинского соболя?",
        opts: ["Баргузинский", "Алтайский", "Кавказский", "Ильменский"],
        corr: 0,
        facts: "Разбор: Баргузинский заповедник был создан в 1916 году для сохранения соболя."
    },
    {
        q: "23. Что из перечисленного относится к государственным символам страны?",
        opts: ["Герб, флаг, гимн", "Язык, традиция, кухня", "Реки, горы, леса", "Памятники, музеи, библиотеки"],
        corr: 0,
        facts: "Разбор: Официальные государственные символы любого государства — Герб, Флаг и Гимн."
    },
    {
        q: "24. Какое растение является хвойным, но сбрасывает хвою на зиму?",
        opts: ["Ель", "Сосна", "Лиственница", "Пихта"],
        corr: 2,
        facts: "Разбор: Лиственница — единственное хвойное дерево в нашей стране, сбрасывающее хвою каждую осень."
    },
    {
        q: "25. Какой орган управляет всеми процессами в организме человека?",
        opts: ["Сердце", "Головной мозг", "Лёгкие", "Желудок"],
        corr: 1,
        facts: "Разбор: Головной мозг — главный орган нервной системы, управляющий всем организмом."
    },
    {
        q: "26. Как называется верхний плодородный слой земли?",
        opts: ["Песок", "Почва", "Глина", "Перегной"],
        corr: 1,
        facts: "Разбор: Почва — поверхностный плодородный слой суши."
    },
    {
        q: "27. Какое из этих животных относится к земноводным?",
        opts: ["Ящерица", "Лягушка", "Змея", "Крокодил"],
        corr: 1,
        facts: "Разбор: Лягушка — амфибия (земноводное). Ящерицы и змеи — пресмыкающиеся."
    },
    {
        q: "28. Какое событие происходит в России 12 июня?",
        opts: ["День Победы", "День России", "День Конституции", "День народного единства"],
        corr: 1,
        facts: "Разбор: 12 июня отмечается государственный праздник — День России."
    },
    {
        q: "29. Какой газ составляет наибольшую часть воздуха?",
        opts: ["Кислород", "Углекислый газ", "Азот", "Озон"],
        corr: 2,
        facts: "Разбор: Азот составляет около 78% объема сухого воздуха."
    },
    {
        q: "30. Какое естественное космическое тело является спутником Земли?",
        opts: ["Солнце", "Марс", "Венера", "Луна"],
        corr: 3,
        facts: "Разбор: Луна — единственный естественный спутник Земли."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаешь окружающий мир и природу! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
