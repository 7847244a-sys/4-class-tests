<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по литературному чтению — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Кто написал сказку \"Сказка о рыбаке и рыбке\"?",
        opts: ["И. А. Крылов", "А. С. Пушкин", "Л. Н. Толстой", "Шарль Перро"],
        corr: 1,
        facts: "Разбор: Пушкин написал её стихами. Крылов прославился баснями, Толстой — рассказами для детей, а Перро — французский сказочник."
    },
    {
        q: "2. Как называется краткое поучительное произведение, в котором высмеиваются пороки, а героями часто становятся животные?",
        opts: ["Рассказ", "Басня", "Повесть", "Стихотворение"],
        corr: 1,
        facts: "Разбор: Басня всегда содержит мораль (поучение) в начале или конце. Рассказ и повесть — это проза, а стихотворение — поэтическая форма."
    },
    {
        q: "3. Какое художественное средство используется в выражении \"золотая осень\"?",
        opts: ["Сравнение", "Метафора", "Эпитет", "Гипербола"],
        corr: 2,
        facts: "Разбор: Эпитет — это образное, красочное определение (какая?). Сравнение требует слов \"как\" или \"словно\", а гипербола — это сильное преувеличение."
    },
    {
        q: "4. Кто является автором знаменитых рассказов для детей \"Филиппок\" и \"Косточка\"?",
        opts: ["Л. Н. Толстой", "Н. Н. Носов", "М. М. Пришвин", "В. Ю. Драгунский"],
        corr: 0,
        facts: "Разбор: Лев Толстой открыл школу для крестьянских детей и сам писал для них рассказы в \"Азбуку\". Носов и Драгунский — советские писатели, жившие позже."
    },
    {
        q: "5. Как называется сильное преувеличение в литературе, например, \"быстрее молнии\"?",
        opts: ["Олицетворение", "Гипербола", "Эпитет", "Метафора"],
        corr: 1,
        facts: "Разбор: Гипербола — это намеренное преувеличение для усиления выразительности. Олицетворение — наделение неживого свойствами живого."
    },
    {
        q: "6. Какое произведение НЕ является народной сказкой?",
        opts: ["Гуси-лебеди", "Каша из топора", "Сказка о царе Салтане", "Морозко"],
        corr: 2,
        facts: "Разбор: Эту сказку написал Александр Пушкин, у нее есть автор. Остальные сказки — русские народные, их сочинил народ."
    },
    {
        q: "7. Какая птица в басне И. А. Крылова выронила сыр из-за лести Лисы?",
        opts: ["Ворона", "Кукушка", "Синица", "Сорока"],
        corr: 0,
        facts: "Разбор: Басня называется \"Ворона и Лисица\". Крылов высмеивает глупую ворону, которая поддалась на сладкие речи хитрой лисы."
    },
    {
        q: "8. Как звали верного пса в сказке А. С. Пушкина \"Сказка о мёртвой царевне и о семи богатырях\"?",
        opts: ["Соколко", "Трезор", "Шарик", "Дружок"],
        corr: 0,
        facts: "Разбор: Пес Соколко верно охранял терем и пытался защитить молодую царевну от отравленного яблока, которое принесла злая мачеха."
    },
    {
        q: "9. Кто написал веселые детские рассказы \"Живая шляпа\" и \"Мишкина каша\"?",
        opts: ["В. П. Астафьев", "Н. Н. Носов", "Б. С. Житков", "В. В. Бианки"],
        corr: 1,
        facts: "Разбор: Николай Носов — мастер смешных и поучительных историй про мальчишек и Незнайку. Бианки писал только о природе и животных."
    },
    {
        q: "10. Как называется начало сказки, например: \"В некотором царстве, в некотором государстве...\"?",
        opts: ["Зачин", "Концовка", "Основная часть", "Кульминация"],
        corr: 0,
        facts: "Разбор: Зачин — это традиционное начало народной сказки. Концовка — это финал (\"И я там был...\"). Кульминация — самый напряженный момент сюжета."
    },
    {
        q: "11. Какое стихотворение начинается со строк: \"Люблю грозу в начале мая...\"?",
        opts: ["Ф. И. Тютчев", "А. А. Фет", "С. А. Есенин", "М. Ю. Лермонтов"],
        corr: 0,
        facts: "Разбор: Это знаменитое стихотворение \"Весенняя гроза\" Федора Тютчева, посвященное радостному пробуждению природы весной."
    },
    {
        q: "12. Кто из героев былин победил Соловья-разбойника?",
        opts: ["Добрыня Никитич", "Алёша Попович", "Илья Муромец", "Святогор"],
        corr: 2,
        facts: "Разбор: Богатырь Илья Муромец подстрелил Соловья-разбойника из лука в густом лесу и привез его в Киев к князю Владимиру."
    },
    {
        q: "13. Как называется небольшое произведение, выражающее личные чувства и переживания автора?",
        opts: ["Повесть", "Ода", "Лирическое стихотворение", "Поэма"],
        corr: 2,
        facts: "Разбор: Лирика всегда передает внутреннее состояние, эмоции и настроение человека. Повесть и поэма — это крупные жанры."
    },
    {
        q: "14. На каком музыкальном инструменте играл Садко в известной новгородской былине?",
        opts: ["На балалайке", "На гуслях", "На гармони", "На ложках"],
        corr: 1,
        facts: "Разбор: Садко так чудесно играл на старинных гуслях, что его музыка заворожила самого Морского царя на самом дне океана."
    },
    {
        q: "15. Какое животное помогало Ивану-царевичу в сказке добыть Жар-птицу?",
        opts: ["Серый волк", "Сивка-бурка", "Кот учёный", "Конёк-горбунок"],
        corr: 0,
        facts: "Разбор: Серый волк случайно съел коня Ивана, но в искупление вины стал ему верным, быстрым и мудрым другом."
    },
    {
        q: "16. Кто написал повесть-сказку \"Приключения Буратино\"?",
        opts: ["Алексей Толстой", "Лев Толстой", "Корней Чуковский", "Самуил Маршак"],
        corr: 0,
        facts: "Разбор: Алексей Толстой пересказал старую итальянскую сказку про Пиноккио на новый лад. Лев Толстой писал рассказы для \"Азбуки\"."
    },
    {
        q: "17. Какое художественное средство используется, когда неодушевлённые предметы ведут себя как живые: \"ветер воет\", \"ручей поёт\"?",
        opts: ["Метафора", "Эпитет", "Олицетворение", "Сравнение"],
        corr: 2,
        facts: "Разбор: Олицетворение наделяет предметы свойствами живого существа или человека."
    },
    {
        q: "18. Из какой известной поэмы А. С. Пушкина взяты строки: \"У лукоморья дуб зелёный...\"?",
        opts: ["Руслан и Людмила", "Кавказский пленник", "Бородино", "Сказка о золотом петушке"],
        corr: 0,
        facts: "Разбор: Это знаменитое стихотворное вступление к первой большой поэме Пушкина \"Руслан и Людмила\"."
    },
    {
        q: "19. Кто автор стихотворения \"Белая берёза под моим окном принакрылась снегом, точно серебром\"?",
        opts: ["А. С. Пушкин", "С. А. Есенин", "М. Ю. Лермонтов", "Ф. И. Тютчев"],
        corr: 1,
        facts: "Разбор: Сергей Есенин — великий поэт, который очень нежно и певуче описывал русскую природу и деревню."
    },
    {
        q: "20. Как звали девочку, которая отправилась спасать своего брата Кая в сказке Х. К. Андерсена \"Снежная королева\"?",
        opts: ["Герда", "Золушка", "Дюймовочка", "Русалочка"],
        corr: 0,
        facts: "Разбор: Герда прошла через множество опасностей и силой своей любви растопила лед в сердце названого брата Кая."
    },
    {
        q: "21. Какое старинное защитное вооружение использовали русские богатыри для защиты от ударов меча?",
        opts: ["Щит", "Копьё", "Лук", "Секира"],
        corr: 0,
        facts: "Разбор: Щит служил для обороны воина, закрывая его от ударов. Копьё, лук и секира — это оружие для нападения."
    },
    {
        q: "22. Кто написал замечательный рассказ-сказку о природе \"Кладовая солнца\"?",
        opts: ["М. М. Пришвин", "И. С. Соколов-Микитов", "Е. И. Чарушин", "В. В. Бианки"],
        corr: 0,
        facts: "Разбор: Михаил Пришвин мастерски совмещал в своих книгах точные наблюдения за лесной жизнью и сказочные сюжеты."
    },
    {
        q: "23. Как называется заключительная, поучительная часть басни?",
        opts: ["Зачин", "Сюжет", "Мораль", "Введение"],
        corr: 2,
        facts: "Разбор: Мораль — это главный логический вывод, урок басни, ради которого автор и пишет произведение. Зачин бывает в сказках."
    },
    {
        q: "24. Какого цвета были волосы у Мальвины в сказке про Буратино?",
        opts: ["Малиновые", "Голубые", "Золотые", "Зелёные"],
        corr: 1,
        facts: "Разбор: Мальвина — красивая кукла из театра Карабаса-Барабаса, у нее были кудрявые волосы необычного голубого цвета."
    },
    {
        q: "25. Какое произведение написал М. Ю. Лермонтов в честь годовщины Бородинского сражения?",
        opts: ["Бородино", "Парус", "Утёс", "Родина"],
        corr: 0,
        facts: "Разбор: Стихотворение написано от лица старого солдата-артиллериста, участника великой битвы (\"Скажи-ка, дядя, ведь не даром...\")."
    },
    {
        q: "26. Какой писатель создал цикл рассказов о мальчике Дениске Кораблёве (\"Денискины рассказы\")?",
        opts: ["В. Ю. Драгунский", "Н. Н. Носов", "К. Г. Паустовский", "В. В. Голявкин"],
        corr: 0,
        facts: "Разбор: Виктор Драгунский написал популярные \"Денискины рассказы\" про жизнь школьников, их смешные приключения и дружбу."
    },
    {
        q: "27. Из какого произведения И. А. Крылова фраза: \"А вы, друзья, как ни садитесь, всё в музыканты не годитесь\"?",
        opts: ["Квартет", "Стрекоза и Муравей", "Мартышка и Очки", "Ворона и Лисица"],
        corr: 0,
        facts: "Разбор: В басне \"Квартет\" Проказница-Мартышка, Осел, Козел да косолапый Мишка пытались красиво сыграть на инструментах, но у них ничего не выходило."
    },
    {
        q: "28. Какое стихотворение А. Л. Барто описывает мальчика, который постоянно меняет свои решения?",
        opts: ["Болтунья", "Верёвочка", "В школу", "Любочка"],
        corr: 0,
        facts: "Разбор: Агния Барто в стихотворении \"Болтунья\" со сценическим юмором рассказывает про девочку Лиду, которая очень много говорит и не выдерживает обещания."
    },
    {
        q: "29. Кто написал сказку \"Теплый хлеб\"?",
        opts: ["К. Г. Паустовский", "М. М. Пришвин", "В. П. Катаев", "А. П. Гайдар"],
        corr: 0,
        facts: "Разбор: Константин Паустовский написал поучительную сказку о мальчике Фильке, обидевшем раненого коня, и о том, как важно вовремя загладить свою вину."
    },
    {
        q: "30. Какое из перечисленных произведений принадлежит перу Ханса Кристиана Андерсена?",
        opts: ["Гадкий утёнок", "Красная Шапочка", "Спящая красавица", "Кот в сапогах"],
        corr: 0,
        facts: "Разбор: \"Гадкий утёнок\" — известная сказка датского писателя Х. К. Андерсена. \"Красная Шапочка\", \"Спящая красавица\" и \"Кот в сапогах\" — сказки Шарля Перро."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);
var firstTryCorrect = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    if (firstTryCorrect[currentIndex] === null) {
        firstTryCorrect[currentIndex] = (selectedIndex === item.corr);
    }
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctFirstTryCount = 0;
    for (var i = 0; i < firstTryCorrect.length; i++) {
        if (firstTryCorrect[i] === true) {
            correctFirstTryCount++;
        }
    }
    
    var percent = Math.round((correctFirstTryCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Верных ответов с первой попытки: " + correctFirstTryCount + " из " + questions.length;
    
    var feedbackText = "";
    if (correctFirstTryCount === 30) {
        feedbackText = "Выполнено на 100%! Ты абсолютный супер-знаток литературы! Поздравляем!";
    } else if (correctFirstTryCount >= 24) {
        feedbackText = "Выполнено! Отличный результат, ты прекрасно помнишь прочитанные книги и готов к 5 классу!";
    } else {
        feedbackText = "Не выполнено! Квест пройден не полностью. Попробуй пройти заново, чтобы улучшить свой результат и вспомнить сюжеты любимых сказок и рассказов!";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    firstTryCorrect = new Array(questions.length).fill(null);
    
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

window.onload = function() {
    renderQuestion();
};
</script>
