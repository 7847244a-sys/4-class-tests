<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по литературному чтению — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Кто является автором произведения «Сказка о царе Салтане»?",
        opts: ["А. С. Пушкин", "М. Ю. Лермонтов", "И. А. Крылов", "Л. Н. Толстой"],
        corr: 0,
        facts: "Разбор: Александр Сергеевич Пушкин — великий русский поэт, написавший «Сказку о царе Салтане»."
    },
    {
        q: "2. Как называется литературный жанр, в котором герои — животные, а в конце есть поучительный вывод (мораль)?",
        opts: ["Рассказ", "Басня", "Сказка", "Стихотворение"],
        corr: 1,
        facts: "Разбор: Басня — это короткое иносказательное произведение с моралью. Великим русским баснописцем был И. А. Крылов."
    },
    {
        q: "3. Какое художественное средство использовано в выражении «золотая осень»?",
        opts: ["Сравнение", "Эпитет", "Олицетворение", "Гипербола"],
        corr: 1,
        facts: "Разбор: Эпитет — это образное, художественное определение (золотая осень, образцовый порядок)."
    },
    {
        q: "4. Кто автор рассказа «Филипок»?",
        opts: ["Н. Н. Носов", "Л. Н. Толстой", "К. Г. Паустовский", "В. Ю. Драгунский"],
        corr: 1,
        facts: "Разбор: Лев Николаевич Толстой написал знаменитый рассказ «Филипок» о мальчике, который очень хотел учиться."
    },
    {
        q: "5. Как называется песня, которой укачивают и усыпляют ребенка?",
        opts: ["Частушка", "Колыбельная", "Былина", "Загадка"],
        corr: 1,
        facts: "Разбор: Колыбельная песня — жанр фольклора, песня, исполняемая матерью или няней при укачивании ребенка."
    },
    {
        q: "6. Кто из героев басни Крылова «стрекоза и муравей» провел лето в праздности?",
        opts: ["Муравей", "Стрекоза", "Шмель", "Бабочка"],
        corr: 1,
        facts: "Разбор: Стрекоза «попрыгунья лето красное пропела», а Муравей трудился всё лето."
    },
    {
        q: "7. Назовите жанр произведения: «Уж небо осенью дышало, уж реже солнышко блистало...»",
        opts: ["Сказка", "Стихотворение", "Повесть", "Басня"],
        corr: 1,
        facts: "Разбор: Это строки из стихотворения А. С. Пушкина (отрывок из романа «Евгений Онегин»)."
    },
    {
        q: "8. Как называется изображение природы в литературном произведении?",
        opts: ["Портрет", "Пейзаж", "Диалог", "Сюжет"],
        corr: 1,
        facts: "Разбор: Пейзаж — описание природы в литературе и живописи. Портрет — описание внешности человека."
    },
    {
        q: "9. Какой персонаж не относится к сказке «Серая Шейка» Д. Н. Мамина-Сибиряка?",
        opts: ["Утка Серая Шейка", "Заяц", "Лиса", "Кот в сапогах"],
        corr: 3,
        facts: "Разбор: Кот в сапогах — персонаж сказки Шарля Перро, а не истории про уточку Серую Шейку."
    },
    {
        q: "10. Что такое фольклор?",
        opts: ["Устное народное творчество", "Авторские книги", "Газетные статьи", "Научные энциклопедии"],
        corr: 0,
        facts: "Разбор: Фольклор — это устное народное творчество (сказки, пословицы, былины, песни), не имеющее одного автора."
    },
    {
        q: "11. Кто написал сказку «Конек-Горбунок»?",
        opts: ["П. П. Ершов", "В. А. Жуковский", "А. С. Пушкин", "С. Т. Аксаков"],
        corr: 0,
        facts: "Разбор: Пётр Павлович Ершов написал знаменитую авторскую сказку в стихах «Конек-Горбунок»."
    },
    {
        q: "12. Как называется краткое мудрое изречение с поучительным смыслом (например, «Без труда не вытащишь и рыбку из пруда»)?",
        opts: ["Пословица", "Поговорка", "Считалка", "Скороговорка"],
        corr: 0,
        facts: "Разбор: Пословица — это законченное народное изречение, содержащее мораль или житейскую мудрость."
    },
    {
        q: "13. Какой главный герой в сказке «Аленький цветочек» С. Т. Аксакова?",
        opts: ["Настенька", "Герда", "Золушка", "Аленушка"],
        corr: 0,
        facts: "Разбор: Настенька — младшая и самая добрая дочь купца, попросившая привезти аленький цветочек."
    },
    {
        q: "14. Как называется разговор двух или нескольких лиц в литературном произведении?",
        opts: ["Монолог", "Диалог", "Описание", "Рассказ"],
        corr: 1,
        facts: "Разбор: Диалог — разговор двух и более героев. Монолог — речь одного героя, обращенная к себе или слушателям."
    },
    {
        q: "15. Кто автор веселых рассказов о Дениске Кораблеве («Денискины рассказы»)?",
        opts: ["В. Ю. Драгунский", "Н. Н. Носов", "Э. Н. Успенский", "К. И. Чуковский"],
        corr: 0,
        facts: "Разбор: Виктор Юзефович Драгунский создатель знаменитого цикла «Денискины рассказы»."
    },
    {
        q: "16. Назовите эпическое произведение фольклора о богатырях и их подвигах:",
        opts: ["Басня", "Былина", "Сказка", "Загадка"],
        corr: 1,
        facts: "Разбор: Былина — героическая песня о подвигах русских богатырей (Ильи Муромца, Добрыни Никитича и др.)."
    },
    {
        q: "17. Что такое олицетворение в литературе?",
        opts: ["Приписывание свойств живых существ предметам и явлениям природы", "Сравнение одного предмета с другим", "Преувеличение свойств предмета", "Употребление слов с противоположным значением"],
        corr: 0,
        facts: "Разбор: Олицетворение — наделение неодушевленных предметов человеческими качествами (например, «ветер шепчет», «метель плачет»)."
    },
    {
        q: "18. Из какого произведения фраза: «Красота-то какая! Лепота!»?",
        opts: ["Народные сказки", "Былина о богатырях", "«Сказка о царе Салтане»", "Пьеса-сказка"],
        corr: 0,
        facts: "Разбор: Это выражение часто встречается в русских народных сказках и старинных сказаниях."
    },
    {
        q: "19. Кто из писателей создал сказку «Двенадцать месяцев»?",
        opts: ["С. Я. Маршак", "К. И. Чуковский", "А. Л. Барто", "С. В. Михалков"],
        corr: 0,
        facts: "Разбор: Самуил Яковлевич Маршак написал знаменитую пьесу-сказку «Двенадцать месяцев»."
    },
    {
        q: "20. Какое из этих произведений написал Николай Николаевич Носов?",
        opts: ["«Приключения Незнайки и его друзей»", "«Денискины рассказы»", "«Дядя Фёдор, кот и пёс»", "«Чук и Гек»"],
        corr: 0,
        facts: "Разбор: Н. Н. Носов — автор истории о Незнайке и других коротышках из Цветочного города."
    },
    {
        q: "21. Как называется главная мысль произведения, то, чему оно нас учит?",
        opts: ["Тема", "Идея (мораль)", "Сюжет", "Завязка"],
        corr: 1,
        facts: "Разбор: Идея — это главная мысль автора, то выводом из чего служит всё произведение."
    },
    {
        q: "22. Кто автор знаменитого стихотворения «Черёмуха» («Черёмуха душистая с весною расцвела...»)?",
        opts: ["С. А. Есенин", "Ф. И. Тютчев", "А. А. Фет", "М. Ю. Лермонтов"],
        corr: 0,
        facts: "Разбор: Сергей Александрович Есенин написала это прекрасное поэтическое произведение о весенней природе."
    },
    {
        q: "23. Какая волшебная вещь была у Царевны-Лягушки в русской народной сказке?",
        opts: ["Волшебная палочка", "Ковер-самолет", "Ей помогали мамины мамки да няньки", "Скатерть-самобранка"],
        corr: 2,
        facts: "Разбор: Василисе Премудрой (Царевне-Лягушке) исполнять трудные задания царя помогали её «мамки и няньки»."
    },
    {
        q: "24. Что такое «сравнение» как средство выразительности?",
        opts: ["Сопоставление одного предмета или явления с другим", "Образное определение", "Переносное значение слова", "Резкое преувеличение"],
        corr: 0,
        facts: "Разбор: Сравнение сопоставляет два предмета с помощью союзов «как», «словно», «будто» (например: «глаза как звезды»)."
    },
    {
        q: "25. Кто из богатырей победил Соловья-Разбойника?",
        opts: ["Илья Муромец", "Добрыня Никитич", "Алеша Попович", "Микула Селянинович"],
        corr: 0,
        facts: "Разбор: Илья Муромец — самый старший и сильный богатырь, одолевший Соловья-Разбойника."
    },
    {
        q: "26. Кто написал повесть-сказку «Приключения Черной курицы, или Подземные жители»?",
        opts: ["Антоний Погорельский", "В. Ф. Одоевский", "В. А. Жуковский", "П. П. Бажов"],
        corr: 0,
        facts: "Разбор: Антоний Погорельский (Алексей Алексеевич Перовский) написал эту сказку для своего племянника Алёши."
    },
    {
        q: "27. Какое из этих произведений принадлежит перу Павла Петровича Бажова?",
        opts: ["«Серебряное копытце»", "«Аленький цветочек»", "«Городок в табакерке»", "«Снежная королева»"],
        corr: 0,
        facts: "Разбор: П. П. Бажов — уральский сказитель, автор сказов «Серебряное копытце», «Медной горы хозяйка»."
    },
    {
        q: "28. Как называется начало событий в художественном произведении?",
        opts: ["Кульминация", "Завязка", "Развязка", "Эпилог"],
        corr: 1,
        facts: "Разбор: Завязка — событие, с которого начинается развитие действия в сюжете."
    },
    {
        q: "29. Как называется самый напряженный и решающий момент в развитии сюжета?",
        opts: ["Завязка", "Кульминация", "Развязка", "Вступление"],
        corr: 1,
        facts: "Разбор: Кульминация — вершина наивысшего напряжения в произведении."
    },
    {
        q: "30. Кто автор сказки «Городок в табакерке»?",
        opts: ["В. Ф. Одоевский", "А. Погорельский", "Л. Н. Толстой", "К. Д. Ушинский"],
        corr: 0,
        facts: "Разбор: Владимир Фёдорович Одоевский написал познавательную сказку «Городок в табакерке» о мальчике Мише."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаете литературу и читаете очень внимательно! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</html>
