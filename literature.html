<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный квест по Литературному чтению (4 класс)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .quiz-card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .header-status {
            font-size: 14px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #202124;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            color: #3c4043;
            outline: none;
        }

        .option-btn:not(:disabled):hover, .option-btn:not(:disabled):active {
            background-color: #f1f3f4;
            border-color: #1a73e8;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #137333;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #c5221f;
        }

        .explanation-block {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
            color: #3c4043;
        }

        .explanation-block.visible {
            display: block;
        }

        .navigation-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .prev-btn {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .prev-btn:hover {
            background-color: #e8eaed;
        }

        .next-btn {
            background-color: #1a73e8;
            color: #ffffff;
            margin-left: auto;
        }

        .next-btn:hover {
            background-color: #1557b0;
        }

        .hidden {
            display: none !important;
        }

        .final-screen {
            text-align: center;
            padding: 20px 0;
        }

        .final-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a73e8;
            margin-bottom: 12px;
        }

        .final-text {
            font-size: 18px;
            margin-bottom: 24px;
            color: #3c4043;
        }

        .restart-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .restart-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

<div class="quiz-card" id="quizCard">
    <div id="gameScreen">
        <div class="header-status" id="counterText">Вопрос 1 из 30</div>
        <div class="question-text" id="questionText">Текст вопроса...</div>
        <div class="options-container" id="optionsContainer"></div>
        <div class="explanation-block" id="explanationBlock"></div>
        
        <div class="navigation-container">
            <button class="nav-btn prev-btn" id="prevBtn" onclick="goToPreviousQuestion()">← Назад</button>
            <button class="nav-btn next-btn" id="nextBtn" onclick="goToNextQuestion()">Дальше →</button>
        </div>
    </div>

    <div id="finalScreen" class="final-screen hidden">
        <div class="final-title">🎉 Поздравляем! 🎉</div>
        <div class="final-text" id="finalResultText">Вы успешно прошли тест по Литературному чтению!</div>
        <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "1. Кто написал сказку \"Сказка о рыбаке и рыбке\"?",
            options: ["И. А. Крылов", "А. С. Пушкин", "Л. Н. Толстой", "Шарль Перро"],
            correct: 1,
            explanation: "Александр Сергеевич Пушкин написал эту сказку в стихах, взяв за основу народные сюжеты. Иван Андреевич Крылов прославился своими баснями («Стрекоза и Муравей»). Лев Николаевич Толстой сочинял назидательные рассказы и бытины для детей («Филиппок»). Шарль Перро — знаменитый французский сказочник, автор «Красной Шапочки» и «Золушки»."
        },
        {
            question: "2. Как называется краткое поучительное произведение, в котором высмеиваются пороки, а героями часто становятся животные?",
            options: ["Рассказ", "Басня", "Повесть", "Стихотворение"],
            correct: 1,
            explanation: "Басня — это короткое иносказательное произведение с обязательным моральным выводом в начале или конце. Рассказ представляет собой небольшое прозаическое произведение о каком-либо событии. Повесть имеет более развернутый сюжет и охватывает большой период жизни героев. Стихотворение — это поэтическое произведение, организованное ритмом и рифмой."
        },
        {
            question: "3. Какое художественное средство используется в выражении \"золотая осень\"?",
            options: ["Сравнение", "Метафора", "Эпитет", "Гипербола"],
            correct: 2,
            explanation: "Эпитет — это образное, красочное определение (какая? золотая). Сравнение сопоставляет предметы с помощью слов «как» или «словно» («листья, как золото»). Метафора — это скрытое сравнение на основе переносного значения («золото листвы»). Гипербола — выразительное преувеличение («миллион желтых листьев»)."
        },
        {
            question: "4. Кто является автором знаменитых рассказов для детей \"Филиппок\" и \"Косточка\"?",
            options: ["Л. Н. Толстой", "Н. Н. Носов", "М. М. Пришвин", "В. Ю. Драгунский"],
            correct: 0,
            explanation: "Лев Николаевич Толстой не только писал великие романы, но и открыл Яснополянскую школу для крестьянских детей, составив для них обучающую «Азбуку». Николай Николаевич Носов писал юмористические истории («Затейники»). Михаил Михайлович Пришвин воспевал русскую природу («Кладовая солнца»). Виктор Юрьевич Драгунский создавал «Денискины рассказы»."
        },
        {
            question: "5. Как называется сильное преувеличение в литературе, например, \"быстрее молнии\"?",
            options: ["Олицетворение", "Гипербола", "Эпитет", "Метафора"],
            correct: 1,
            explanation: "Гипербола (от греческого «преувеличение») используется авторами для усиления выразительности речи. Олицетворение наделяет неживые предметы свойствами живых существ («речка бежит»). Эпитет придает предмету яркую эмоциональную окраску («быстрый ручей»). Метафора переносно сравнивает предметы по сходству («молния мысли»)."
        },
        {
            question: "6. Какое произведение НЕ является народной сказкой?",
            options: ["Гуси-лебеди", "Каша из топора", "Сказка о царе Салтане", "Морозко"],
            correct: 2,
            explanation: "«Сказка о царе Салтане» — это авторское литературное произведение А. С. Пушкина. Сказки «Гуси-лебеди», «Каша из топора» и «Морозко» относятся к фольклору (русским народным сказкам), так как создавались народом и передавались из уст в уста."
        },
        {
            question: "7. Какая птица в басне И. А. Крылова выронила сыр из-за лести Лисы?",
            options: ["Ворона", "Кукушка", "Синица", "Сорока"],
            correct: 0,
            explanation: "В басне «Ворона и Лисица» именно глупая Ворона поддалась льстивым речам Лисы, запела «во все воронье горло» и выронила лакомый кусочек сыра. Кукушка и Петух — герои другой басни Крылова о взаимной похвале. Синица и Сорока встречаются в иных фольклорных и басенных сюжетах."
        },
        {
            question: "8. Как звали верного пса в сказке А. С. Пушкина \"Сказка о мёртвой царевне и о семи богатырях\"?",
            options: ["Соколко", "Трезор", "Шарик", "Дружок"],
            correct: 0,
            explanation: "Пес Соколко верной службой пытался предупредить царевну об опасности и даже проглотил отравленное яблоко злой мачехи, чтобы спасти хозяйку. Трезор, Шарик и Дружок — традиционные клички собак из народных и современных детских рассказов."
        },
        {
            question: "9. Кто написал рассказы \"Живая шляпа\" и \"Мишкина каша\"?",
            options: ["В. П. Астафьев", "Н. Н. Носов", "Б. С. Житков", "В. В. Бианки"],
            correct: 1,
            explanation: "Николай Николаевич Носов — признанный мастер детского юмора, подаривший нам истории о Незнайке и его друзьях. Виктор Петрович Астафьев писал глубокие произведения о сибирской природе и детстве («Конь с розовой гривой»). Борис Степанович Житков известен сборником «Что я видел». Виталий Валентинович Бианки писал «Лесную газету»."
        },
        {
            question: "10. Как называется начало сказки, например: \"В некотором царстве, в некотором государстве...\"?",
            options: ["Зачин", "Концовка", "Основная часть", "Кульминация"],
            correct: 0,
            explanation: "Зачин — это традиционная формула начала народной сказки, настраивающая слушателя на волшебный лад. Концовка подводит итог («Стали жить-поживать да добра наживать»). Основная часть раскрывает приключения героев. Кульминация представляет собой наивысший момент напряжения в сюжете."
        },
        {
            question: "11. Какое стихотворение начинается со строк: \"Люблю грозу в начале мая...\"?",
            options: ["Ф. И. Тютчев", "А. А. Фет", "С. А. Есенин", "М. Ю. Лермонтов"],
            correct: 0,
            explanation: "Фёдор Иванович Тютчев написал знаменитое стихотворение «Весенняя гроза», восхваляющее буйство весенней природы. Афанасий Афанасьевич Фет славился тонкой пейзажной лирикой («Шепот, боязливое дыханье»). Сергей Александрович Есенин воспевал березы и поля. Михаил Юрьевич Лермонтов писал романтическую и патриотическую поэзию."
        },
        {
            question: "12. Кто из героев былин победил Соловья-разбойника?",
            options: ["Добрыня Никитич", "Алёша Попович", "Илья Муромец", "Святогор"],
            correct: 2,
            explanation: "Крестьянский сын Илья Муромец метким выстрелом из лука сбил Соловья-разбойника с дуба и пленил его. Добрыня Никитич прославился победой над Змеем Горынычем. Алёша Попович одолел Тугарина Змеевича благодаря хитрости. Святогор — исполинский богатырь, передавший часть силы Илье."
        },
        {
            question: "13. Как называется небольшое прозаическое или стихотворное произведение, выражающее личные чувства автора?",
            options: ["Повесть", "Ода", "Лирическое стихотворение", "Поэма"],
            correct: 2,
            explanation: "Лирическое стихотворение всегда сфокусировано на передаче внутренних душевных переживаний, настроения и эмоций автора. Повесть раскрывает повествовательный сюжет в прозе. Ода — это торжественное стихотворение в честь важного события. Поэма — крупное стихотворное произведение с сюжетной линией."
        },
        {
            question: "14. На каком музыкальном инструменте играл Садко в известной новгородской былине?",
            options: ["На балалайке", "На гуслях", "На гармони", "На ложках"],
            correct: 1,
            explanation: "Новгородский гусляр и купец Садко играл на яровчатых гуслях столь прекрасно, что покорил Владыку Морского. Балалайка и гармонь появились гораздо позже периода создания былин, а деревянные ложки использовались как ритмический инструмент в народных ансамблях."
        },
        {
            question: "15. Какое животное помогало Ивану-царевичу в сказке добыть Жар-птицу?",
            options: ["Серый волк", "Сивка-бурка", "Кот учёный", "Конёк-горбунок"],
            correct: 0,
            explanation: "Серый волк стал надежным верным помощником Ивана-царевича после того, как съел его коня. Сивка-бурка — волшебный конь из одноименной сказки. Кот учёный — персонаж пролога к «Руслану и Людмиле». Конёк-горбунок — главный герой сказки П. П. Ершова."
        },
        {
            question: "16. Кто написал повесть-сказку \"Приключения Буратино\"?",
            options: ["Алексей Толстой", "Лев Толстой", "Корней Чуковский", "Самуил Маршак"],
            correct: 0,
            explanation: "Алексей Николаевич Толстой создал «Золотой ключик, или Приключения Буратино», творчески переработав сказку Карло Коллоди о Пиноккио. Лев Николаевич Толстой — классик мировой литературы, автор романов. Корней Иванович Чуковский написал «Мойдодыра» и «Айболита». Самуил Яковлевич Маршак — автор сказки «Двенадцать месяцев»."
        },
        {
            question: "17. Какое художественное средство используется, когда неодушевлённые предметы ведут себя как живые: \"ветер воет\", \"ручей поёт\"?",
            options: ["Метафора", "Эпитет", "Олицетворение", "Сравнение"],
            correct: 2,
            explanation: "Олицетворение наделяет неодушевленные явления качествами живых существ (способностью петь, говорить, плакать). Метафора переносит свойства одного предмета на другой по сходству. Эпитет ярко подчеркивает характер признака. Сравнение сопоставляет два явления со союзами «как», «словно»."
        },
        {
            question: "18. Из какого произведения эти строки: \"У лукоморья дуб зелёный...\"?",
            options: ["Руслан и Людмила", "Кавказский пленник", "Бородино", "Сказка о золотом петушке"],
            correct: 0,
            explanation: "Эти строки представляют собой пролог (вступление) к поэме А. С. Пушкина «Руслан и Людмила». «Кавказский пленник» — поэма А. С. Пушкина и рассказ Л. Н. Толстого. «Бородино» — патриотическое стихотворение М. Ю. Лермонтова. «Сказка о золотом петушке» — сказка А. С. Пушкина."
        },
        {
            question: "19. Кто автор стихотворения \"Белая берёза под моим окном принакрылась снегом, точно серебром\"?",
            options: ["А. С. Пушкин", "С. А. Есенин", "М. Ю. Лермонтов", "Ф. И. Тютчев"],
            correct: 1,
            explanation: "Сергей Александрович Есенин написал это поэтичное стихотворение «Береза» в 1913 году. А. С. Пушкин создавал стихотворения «Зимнее утро» и «Зимняя дорога». М. Ю. Лермонтов — автор стихотворений «Парус» и «Утес». Ф. И. Тютчев воспевал приход весны и осенние дни."
        },
        {
            question: "20. Как звали девочку, которая отправилась спасать своего брата Кая в сказке Х. К. Андерсена \"Снежная королева\"?",
            options: ["Герда", "Золушка", "Дюймовочка", "Русалочка"],
            correct: 0,
            explanation: "Отважная Герда прошла через множественные испытания и растопила заледеневшее сердце Кая своей искренней любовью. Золушка — героиня сказки Шарля Перро. Дюймовочка и Русалочка — персонажи других известных сказок Ханса Кристиана Андерсена."
        },
        {
            question: "21. Какое старинное защитное вооружение использовали русские богатыри для защиты от ударов меча?",
            options: ["Щит", "Копьё", "Лук", "Секира"],
            correct: 0,
            explanation: "Щит являлся основным элементом оборонительного доспеха воина, отражавшим удары. Копьё применялось в качестве колющего оружия. Лук использовался для поражения целей на расстоянии. Секира представляет собой боевой топор для рубки в ближнем бою."
        },
        {
            question: "22. Кто написал рассказ-сказку о природе \"Кладовая солнца\"?",
            options: ["М. М. Пришвин", "И. С. Соколов-Микитов", "Е. И. Чарушин", "В. В. Бианки"],
            correct: 0,
            explanation: "Михаил Михайлович Пришвин написал «Кладовую солнца» о приключениях сирот Насти и Митраши на Блудовом болоте. Иван Сергеевич Соколов-Микитов составлял очерки о русской природе. Евгений Иванович Чарушин иллюстрировал и писал рассказы о животных («Тюпа, Томка и охотник»). Виталий Валентинович Бианки написал сказку-небылицу «Первая охота»."
        },
        {
            question: "23. Как называется заключительная, поучительная часть басни?",
            options: ["Зачин", "Сюжет", "Мораль", "Введение"],
            correct: 2,
            explanation: "Мораль содержит прямо сформулированное поучение и основной нравственный урок басни. Зачин — традиционное начало сказок. Сюжет отражает ход событий в произведении. Введение настраивает читателя на восприятие текста."
        },
        {
            question: "24. Какого цвета были волосы у Мальвины в сказке про Буратино?",
            options: ["Малиновые", "Голубые", "Золотые", "Зелёные"],
            correct: 1,
            explanation: "Мальвина — красивая кукла с голубыми волосами и фарфоровой головой, сбежавшая из кукольного театра Карабаса-Барабаса. Остальные варианты цвета волос не соответствуют авторскому описанию А. Н. Толстого."
        },
        {
            question: "25. Какое произведение написал М. Ю. Лермонтов в честь годовщины Бородинского сражения?",
            options: ["Бородино", "Парус", "Утёс", "Родина"],
            correct: 0,
            explanation: "Стихотворение «Бородино» написано к 25-летию победы в Отечественной войне 1812 года и передает события от лица старого ветерана. «Парус», «Утёс» и «Родина» — выдающиеся образцы философской и пейзажно-патриотической лирики Лермонтова."
        },
        {
            question: "26. Как называется сказка, в которой падчерица отправляется зимой в лес за подснежниками?",
            options: ["Двенадцать месяцев", "Морозко", "Снегурочка", "Госпожа Метелица"],
            correct: 0,
            explanation: "«Двенадцать месяцев» — драматическая сказка Самуила Яковлевича Маршака. В «Морозко» дедушка одаривает трудолюбивую девушку за доброту. «Снегурочка» — сказка о вылепленной из снега девочке. «Госпожа Метелица» — сказка братьев Гримм."
        },
        {
            question: "27. Какая фамилия была у Дениски, героя знаменитых \"Денискиных рассказов\" В. Драгунского?",
            options: ["Кораблёв", "Попов", "Иванов", "Смирнов"],
            correct: 0,
            explanation: "Главный герой веселых циклов Викторa Драгунского — Дениска Кораблёв, у которого был лучший друг Мишка Слонов. Фамилии Попов, Иванов и Смирнов в названии цикла и у ключевых героев не фигурируют."
        },
        {
            question: "28. Кто является автором сказки в стихах \"Конёк-горбунок\"?",
            options: ["П. П. Ершов", "В. А. Жуковский", "А. С. Пушкин", "С. Т. Аксаков"],
            correct: 0,
            explanation: "Пётр Павлович Ершов создал великолепную сказку «Конёк-горбунок» во время учебы в университете. Василий Андреевич Жуковский известен сказкой «Спящая царевна». А. С. Пушкин высоко оценил произведение Ершова. Сергей Тимофеевич Аксаков написал сказку «Аленький цветочек»."
        },
        {
            question: "29. Кто из названных писателей является главным русским баснописцем?",
            options: ["И. А. Крылов", "А. С. Пушкин", "Н. А. Некрасов", "Ф. И. Тютчев"],
            correct: 0,
            explanation: "Иван Андреевич Крылов написал более 200 басен, вошедших в золотой фонд русской литературы. А. С. Пушкин — величайший поэт и прозаик. Н. А. Некрасов воспевал жизнь народа («Дедушка Мазай и зайцы»). Ф. И. Тютчев — мастер тонкой пейзажной лирики."
        },
        {
            question: "30. Как называется сказка С. Т. Аксакова о волшебном цветке и верной любви?",
            options: ["Аленький цветочек", "Цветик-семицветик", "Каменный цветок", "Дикие лебеди"],
            correct: 0,
            explanation: "Сергей Тимофеевич Аксаков записал «Аленький цветочек» со слов ключницы Пелагеи. «Цветик-семицветик» написал Валентин Катаев. «Каменный цветок» — сказ Павла Бажова. «Дикие лебеди» — сказка Х. К. Андерсена."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(questions.length).fill(null);

    const counterText = document.getElementById('counterText');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationBlock = document.getElementById('explanationBlock');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const gameScreen = document.getElementById('gameScreen');
    const finalScreen = document.getElementById('finalScreen');

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        
        counterText.textContent = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
        questionText.textContent = q.question;
        optionsContainer.innerHTML = '';
        
        const hasAnswered = userAnswers[currentQuestionIndex] !== null;

        q.options.forEach((optionText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optionText;
            
            if (hasAnswered) {
                btn.disabled = true;
                const selectedIdx = userAnswers[currentQuestionIndex];
                if (idx === q.correct) {
                    btn.classList.add('correct');
                }
                if (idx === selectedIdx && selectedIdx !== q.correct) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectOption(idx);
            }

            optionsContainer.appendChild(btn);
        });

        if (hasAnswered) {
            explanationBlock.textContent = q.explanation;
            explanationBlock.classList.add('visible');
            nextBtn.classList.remove('hidden');
        } else {
            explanationBlock.classList.remove('visible');
            nextBtn.classList.add('hidden');
        }

        if (currentQuestionIndex === 0) {
            prevBtn.classList.add('hidden');
        } else {
            prevBtn.classList.remove('hidden');
        }

        if (currentQuestionIndex === questions.length - 1 && hasAnswered) {
            nextBtn.textContent = 'Завершить →';
        } else {
            nextBtn.textContent = 'Дальше →';
        }
    }

    function selectOption(index) {
        userAnswers[currentQuestionIndex] = index;
        renderQuestion();
    }

    function goToNextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            showFinalScreen();
        }
    }

    function goToPreviousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function showFinalScreen() {
        gameScreen.classList.add('hidden');
        finalScreen.classList.remove('hidden');
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        userAnswers.fill(null);
        finalScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        renderQuestion();
    }

    renderQuestion();
</script>
