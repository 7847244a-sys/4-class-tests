<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по технологии — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Какой инструмент используется для резания бумаги и картона?",
        opts: ["Ножницы", "Линейка", "Шило", "Игла"],
        corr: 0,
        facts: "Разбор: Ножницы — основной инструмент для резания листовых материалов."
    },
    {
        q: "2. Как правильно передавать ножницы другому человеку?",
        opts: ["Острыми концами вперёд", "Кольцами вперёд", "Лезвиями вбок", "Броском"],
        corr: 1,
        facts: "Разбор: Ножницы следует передавать кольцами вперёд с сомкнутыми лезвиями."
    },
    {
        q: "3. Какой материал получают из древесины?",
        opts: ["Пластилин", "Бумага", "Ткань", "Стекло"],
        corr: 1,
        facts: "Разбор: Бумагу получают из целлюлозы, производяемой из древесины."
    },
    {
        q: "4. Как называется плотная бумага, применяемая для изготовления коробок?",
        opts: ["Салфетка", "Картон", "Калька", "Фольга"],
        corr: 1,
        facts: "Разбор: Картон отличается высокой плотностью и жесткостью."
    },
    {
        q: "5. Какой инструмент служит для проведения прямых линий и измерений?",
        opts: ["Циркуль", "Линейка", "Шило", "Ластик"],
        corr: 1,
        facts: "Разбор: Линейка применяется для измерения и черчения прямых линий."
    },
    {
        q: "6. Как называется развёртка объёмного изделия из бумаги?",
        opts: ["Выкройка", "Шаблон", "Чертеж развертки", "Эскиз"],
        corr: 2,
        facts: "Разбор: Развертка — это плоская заготовка, из которой складывают объемное изделие."
    },
    {
        q: "7. Что из перечисленного относится к природным материалам?",
        opts: ["Пластилин", "Шишки и листья", "Пенопласт", "Скрепки"],
        corr: 1,
        facts: "Разбор: Шишки, листья, веточки, семена — это природные материалы."
    },
    {
        q: "8. Какой клей лучше всего подходит для склеивания бумаги и картона?",
        opts: ["Клей ПВА", "Момент", "Эпоксидный", "Резиновый"],
        corr: 0,
        facts: "Разбор: Клей ПВА и клей-карандаш — основные виды клея для работы с бумагой."
    },
    {
        q: "9. Как называется вырезание и наклеивание деталей из бумаги на основу?",
        opts: ["Оригами", "Аппликация", "Папье-маше", "Лепка"],
        corr: 1,
        facts: "Разбор: Аппликация — техника создания изображений путем наклеивания деталей на основу."
    },
    {
        q: "10. Какое искусственное вещество применяется для лепки и моделирования?",
        opts: ["Глина", "Пластилин", "Воск", "Гипс"],
        corr: 1,
        facts: "Разбор: Пластилин — пластичный искусственный материал для лепки."
    },
    {
        q: "11. Инструмент для черчения окружностей — это:",
        opts: ["Транспортир", "Циркуль", "Угольник", "Рейсшина"],
        corr: 1,
        facts: "Разбор: Циркуль предназначен для вычерчивания окружностей и дуг."
    },
    {
        q: "12. Какое правило техники безопасности нужно соблюдать при работе с иглой?",
        opts: ["Втыкать иглу в одежду", "Хранить иглу в игольнице", "Оставлять на столе без нитки", "Класть на край стола"],
        corr: 1,
        facts: "Разбор: Иглы и булавки всегда нужно хранить в специальной игольнице."
    },
    {
        q: "13. Искусство складывания фигурок из бумаги без клея и ножниц называется:",
        opts: ["Квиллинг", "Оригами", "Декупаж", "Скрапбукинг"],
        corr: 1,
        facts: "Разбор: Оригами — традиционное японское искусство складывания бумажных фигур."
    },
    {
        q: "14. Какая ткань относится к натуральным растительным тканям?",
        opts: ["Шёлк", "Шерсть", "Хлопок", "Капрон"],
        corr: 2,
        facts: "Разбор: Хлопок получают из волокон хлопчатника (растительное происхождение)."
    },
    {
        q: "15. Какой ручной шов используется для скрепления деталей и обработки краев?",
        opts: ["Вперед иголку", "Петельный", "Машинный", "Крестик"],
        corr: 1,
        facts: "Разбор: Петельный шов часто применяют для обработки краев ткани и аппликаций."
    },
    {
        q: "16. Для чего нужна подкладная доска при работе с пластилином?",
        opts: ["Чтобы не пачкать стол", "Для украшения", "Для сушки", "Чтобы пластилин быстро сох"],
        corr: 0,
        facts: "Разбор: Подкладная доска защищает рабочую поверхность стола от загрязнения."
    },
    {
        q: "17. Что такое технологическая карта?",
        opts: ["Географическая карта", "Документ с последовательностью выполнения изделия", "Рисунок готовой поделки", "Список инструментов"],
        corr: 1,
        facts: "Разбор: Технологическая карта описывает пошаговый процесс изготовления изделия."
    },
    {
        q: "18. Какой инструмент помогает прокалывать отверстия в плотных материалах?",
        opts: ["Шило", "Ножницы", "Скальпель", "Пилка"],
        corr: 0,
        facts: "Разбор: Шило применяется для прокалывания отверстий в картоне, коже и ткани."
    },
    {
        q: "19. Из какого материала получают шерстяные нити?",
        opts: ["Растений", "Шерсти животных", "Нефти", "Древесины"],
        corr: 1,
        facts: "Разбор: Шерстяные нити делают из волосяного покрова животных (овец, коз)."
    },
    {
        q: "20. Какая техника использует скрученные полоски бумаги для создания композиций?",
        opts: ["Папье-маше", "Квиллинг", "Коллаж", "Ткачество"],
        corr: 1,
        facts: "Разбор: Квиллинг — искусство бумагокручения."
    },
    {
        q: "21. Какое правило нужно соблюдать при работе с клеем?",
        opts: ["Наносить клей пальцами", "Использовать кисть или насадку-дозатор", "Наливать клей прямо на стол", "Тратить как можно больше клея"],
        corr: 1,
        facts: "Разбор: Клей наносят кистью или специальным дозатором аккуратно и тонким слоем."
    },
    {
        q: "22. Как называется повторение элементов узора на ткани или бумаге?",
        opts: ["Орнамент", "Эскиз", "Макет", "Профиль"],
        corr: 0,
        facts: "Разбор: Орнамент — узор, основанный на ритмичном повторении элементов."
    },
    {
        q: "23. Что такое макет изделия?",
        opts: ["Объемная модель изделия в уменьшенном или натуральном масштабе", "Чертеж на бумаге", "Инструкция", "Материал для работы"],
        corr: 0,
        facts: "Разбор: Макет — это объемный образец проектируемого объекта."
    },
    {
        q: "24. Из чего состоит ткань?",
        opts: ["Из переплетенных нитей", "Из листов бумаги", "Из плёнки", "Из волокон пластика"],
        corr: 0,
        facts: "Разбор: Ткань образуется путем переплетения взаимно перпендикулярных нитей."
    },
    {
        q: "25. Какой вид работы заключается в создании изделий из рваных или резаных кусочков газеты и клея?",
        opts: ["Оригами", "Папье-маше", "Мозаика", "Лепка"],
        corr: 1,
        facts: "Разбор: Папье-маше — легко поддающаяся формованию масса из бумаги и клея."
    },
    {
        q: "26. Как называется разметка деталей с помощью готовой фигуры-образца?",
        opts: ["Разметка по шаблону", "Разметка по линейке", "Разметка на глаз", "Разметка по циркулю"],
        corr: 0,
        facts: "Разбор: Шаблон — готовый образец, который обводят карандашом на материале."
    },
    {
        q: "27. Какой инструмент используется для приглаживания складок и сгибов бумаги?",
        opts: ["Гладилка (или кольца ножниц)", "Молоток", "Плоскогубцы", "Игла"],
        corr: 0,
        facts: "Разбор: Сгиб четко проглаживают гладилкой или кольцами ножниц."
    },
    {
        q: "28. Что необходимо сделать по окончании работы на уроке технологии?",
        opts: ["Убрать рабочее место и вымыть руки", "Оставить все на столе и уйти", "Сложить инструменты в портфель без чехлов", "Выбросить все материалы"],
        corr: 0,
        facts: "Разбор: По окончании работы всегда нужно навести порядок на столе и вымыть руки."
    },
    {
        q: "29. Какая нить в ткани идет вдоль края (кромки)?",
        opts: ["Нить основы", "Нить утока", "Вспомогательная нить", "Швейная нить"],
        corr: 0,
        facts: "Разбор: Продольные нити ткани называются нитями основы."
    },
    {
        q: "30. Какой материал используют для создания прочных конструктивных каркасов моделей?",
        opts: ["Тонкая бумага", "Конструктор или проволока", "Пластилин", "Салфетки"],
        corr: 1,
        facts: "Разбор: Каркасы и прочные элементы собирают из деталей конструктора или проволоки."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаете технологию и правила работы! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
