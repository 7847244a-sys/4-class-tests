<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по русскому языку — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Укажите слово с проверочной безударной гласной в корне: в...сёлый",
        opts: ["весело", "веселье", "веселиться", "повеселел"],
        corr: 1,
        facts: "Разбор: Слово «веселье» является проверочным, так как ударение падает на проверяемую гласную (весе́лье)."
    },
    {
        q: "2. Какая часть слова находится перед корнем и служит для образования новых слов?",
        opts: ["Суффикс", "Приставка", "Окончание", "Основа"],
        corr: 1,
        facts: "Разбор: Приставка — это значимая часть слова, которая стоит перед корнем."
    },
    {
        q: "3. Найдите существительное 3-го склонения:",
        opts: ["Конь", "Мышь", "Окно", "Река"],
        corr: 1,
        facts: "Разбор: К 3-му склонению относятся существительные женского рода с нулевым окончанием на мягкий знак (мышь, ночь, дочь)."
    },
    {
        q: "4. Выберите слово с непроизносимой согласной в корне:",
        opts: ["Ужас...ный", "Солн...це", "Прекрас...ный", "Вкус...ный"],
        corr: 1,
        facts: "Разбор: Солнце — проверочное слово «солнечный» (непроизносимая буквосочетание -лнц-)."
    },
    {
        q: "5. Какая часть речи отвечает на вопросы «Что делать?», «Что сделать?»?",
        opts: ["Имя существительное", "Имя прилагательное", "Глагол", "Местоимение"],
        corr: 2,
        facts: "Разбор: Глагол обозначает действие предмета и отвечает на вопросы «что делать?», «что сделать?»."
    },
    {
        q: "6. Укажите слово с разделительным мягким знаком (Ь):",
        opts: ["Вьюга", "Коньки", "Пальто", "Мальчик"],
        corr: 0,
        facts: "Разбор: Разделительный Ь пишется в корне или после корня перед гласными Е, Ё, Ю, Я, И (вьюга)."
    },
    {
        q: "7. Укажите глагол II спряжения:",
        opts: ["Читать", "Смотреть", "Писать", "Гулять"],
        corr: 1,
        facts: "Разбор: Смотреть — глагол-исключение, относится ко II спряжению."
    },
    {
        q: "8. Найдите предложение с однородными членами:",
        opts: ["Наступила золотая осень.", "Дети пели, танцевали и играли.", "Кот спал на мягком диване.", "В небе летали птицы."],
        corr: 1,
        facts: "Разбор: В этом предложении однородные сказуемые: пели, танцевали, играли."
    },
    {
        q: "9. В каком слове пишется приставка С-?",
        opts: ["Сделать", "Зделать", "Збор", "Збежать"],
        corr: 0,
        facts: "Разбор: Приставки З- в русском языке не существует, всегда пишется приставка С- (сделать, сдать)."
    },
    {
        q: "10. Какое из этих слов является синонимом к слову «большой»?",
        opts: ["Маленький", "Огромный", "Быстрый", "Красивый"],
        corr: 1,
        facts: "Разбор: Синонимы — слова, близкие по значению. Большой — огромный, крупный."
    },
    {
        q: "11. Какое слово является антонимом к слову «тишина»?",
        opts: ["Покой", "Шум", "Молчание", "Тень"],
        corr: 1,
        facts: "Разбор: Антонимы — слова с противоположным значением (тишина — шум)."
    },
    {
        q: "12. Выберите верное окончание глагола: Он пиш...т письмо.",
        opts: ["-ат", "-ет", "-ит", "-ут"],
        corr: 1,
        facts: "Разбор: Глагол «писать» I спряжения (на -ать), поэтому в 3-м лице ед. ч. окончание -ет (пишет)."
    },
    {
        q: "13. Укажите главные члены предложения (грамматическую основу): «Яркое солнце осветило зелёный луг».",
        opts: ["Яркое солнце", "Осветило луг", "Солнце осветило", "Зелёный луг"],
        corr: 2,
        facts: "Разбор: Подлежащее — солнце (что?), сказуемое — осветило (что сделало?). Основа: солнце осветило."
    },
    {
        q: "14. Какое слово написано без ошибки?",
        opts: ["Мароз", "Собака", "Карова", "Традиция"],
        corr: 1,
        facts: "Разбор: Словарное слово «собака» пишется с гласной О в первом слоге."
    },
    {
        q: "15. Какое из этих слов является наречием?",
        opts: ["Быстро", "Быстрый", "Быстрота", "Побыстреть"],
        corr: 0,
        facts: "Разбор: Наречие отвечает на вопрос «Как?»: (как?) быстро."
    },
    {
        q: "16. Укажите падеж существительного: «подарил (кому?) другу»",
        opts: ["Именительный", "Родительный", "Дательный", "Винительный"],
        corr: 2,
        facts: "Разбор: На вопросы «Кому? Чему?» отвечает Дательный падеж."
    },
    {
        q: "17. В каком слове нужен разделительный твёрдый знак (Ъ)?",
        opts: ["С...ъезд", "В...юга", "Сем...я", "П...еса"],
        corr: 0,
        facts: "Разбор: Разделительный Ъ пишется после приставок на согласную перед гласными Е, Ё, Ю, Я (съезд, подъезд)."
    },
    {
        q: "18. Сколько букв и звуков в слове «яблоко»?",
        opts: ["6 букв, 6 звуков", "6 букв, 7 звуков", "7 букв, 6 звуков", "6 букв, 5 звуков"],
        corr: 1,
        facts: "Разбор: Буква Я в начале слова даёт 2 звука [й'а]. Итого: 6 букв, 7 звуков."
    },
    {
        q: "19. Какой частью речи является слово «он»?",
        opts: ["Существительное", "Прилагательное", "Местоимение", "Предлог"],
        corr: 2,
        facts: "Разбор: Он — личное местоимение 3-го лица."
    },
    {
        q: "20. Какая буква пропущена в слове: реч...ка?",
        opts: ["ь", "и", "ничего не нужно", "е"],
        corr: 2,
        facts: "Разбор: Сочетания ЧК, ЧН, ЧТ, ЩН пишутся без мягкого знака."
    },
    {
        q: "21. Найдите имя прилагательное во множественном числе:",
        opts: ["Красивый", "Красивая", "Красивые", "Красивое"],
        corr: 2,
        facts: "Разбор: Форма «красивые» отвечает на вопрос «Какие?» и относится ко множественному числу."
    },
    {
        q: "22. Какое слово является однокоренным к слову «лес»?",
        opts: ["Лесник", "Леса", "Лесом", "Лесу"],
        corr: 0,
        facts: "Разбор: Лесник — новое слово с суффиксом -ник. Остальные варианты — формы одного и того же слова «лес»."
    },
    {
        q: "23. В каком слове на конце пишется Ь?",
        opts: ["Врач...", "Грач...", "Дочь...", "Мяч..."],
        corr: 2,
        facts: "Разбор: На конце существительных женского рода 3-го склонения после шипящих пишется Ь (дочь, ночь, вещь)."
    },
    {
        q: "24. Укажите предложение с прямой речью (знаки препинания не расставлены):",
        opts: ["Мама сказала что пора обедать", "Учитель спросил Кто готов к уроку", "Дети побежали на улицу", "Наступил вечер и стало прохладно"],
        corr: 1,
        facts: "Разбор: Второе предложение содержит слова автора и точную речь учителя: Учитель спросил: «Кто готов к уроку?»."
    },
    {
        q: "25. Какое из слов является сложным (состоит из двух корней)?",
        opts: ["Пылесос", "Самоварник", "Троллейбус", "Подснежник"],
        corr: 0,
        facts: "Разбор: Пылесос имеет два корня: -пыл- и -сос- (соединительная гласная е)."
    },
    {
        q: "26. Укажите служебную часть речи:",
        opts: ["Глагол", "Предлог", "Наречие", "Имя числительное"],
        corr: 1,
        facts: "Разбор: Предлоги, союзы и частицы — служебные части речи."
    },
    {
        q: "27. Какое слово пишется с заглавной буквы?",
        opts: ["(г)ород", "(р)ека", "(м)осква", "(с)трана"],
        corr: 2,
        facts: "Разбор: Названия городов, рек и стран — имена собственные, пишутся с большой буквы (Москва)."
    },
    {
        q: "28. Укажите ошибочное написание:",
        opts: ["Жизнь", "Шишка", "Чудо", "Чащя"],
        corr: 3,
        facts: "Разбор: Сочетания ЧА-ЩА всегда пишутся с буквой А: чаща."
    },
    {
        q: "29. Какое время у глагола «прочитал»?",
        opts: ["Настоящее", "Прошедшее", "Будущее", "Неопределенная форма"],
        corr: 1,
        facts: "Разбор: Глагол отвечает на вопрос «Что сделал?» и имеет суффикс -л- — это прошедшее время."
    },
    {
        q: "30. Какое из этих слов является именем числительным?",
        opts: ["Пять", "Пятерка", "Пятый", "Пятиэтажный"],
        corr: 0,
        facts: "Разбор: Пять — количественное числительное (обозначает количество при счете)."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаешь правила русского языка! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
