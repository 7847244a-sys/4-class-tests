<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по ОРКСЭ — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Как называется золотое правило нравственности?",
        opts: ["Поступай с другими так, как хочешь, чтобы поступали с тобой", "Каждый сам за себя", "Побеждает сильнейший", "Делай только то, что выгодно"],
        corr: 0,
        facts: "Разбор: Золотое правило нравственности гласит: относись к людям так, как ты хочешь, чтобы они относились к тебе."
    },
    {
        q: "2. Что такое совесть?",
        opts: ["Способность человека оценивать свои поступки с точки зрения добра и зла", "Наказание за проступок", "Правило поведения в школе", "Умение красиво говорить"],
        corr: 0,
        facts: "Разбор: Совесть — это внутренний голос человека, который помогает отличать хорошие поступки от плохих."
    },
    {
        q: "3. Как называется священная книга христиан?",
        opts: ["Коран", "Библия", "Тора", "Трипитака"],
        corr: 1,
        facts: "Разбор: Библия — священная книга христиан, состоящая из Ветхого и Нового Заветов."
    },
    {
        q: "4. Как называется священная книга мусульман?",
        opts: ["Библия", "Коран", "Веды", "Авеста"],
        corr: 1,
        facts: "Разбор: Коран — священная книга ислама."
    },
    {
        q: "5. Какая из этих традиционных религий является древнейшей мировой религией?",
        opts: ["Христианство", "Ислам", "Буддизм", "Иудаизм"],
        corr: 2,
        facts: "Разбор: Буддизм возник в VI веке до н. э. и считается древнейшей из мировых религий."
    },
    {
        q: "6. Что такое патриотизм?",
        opts: ["Любовь к своему Отечеству и своему народу", "Любовь к путешествиям", "Знание иностранных языков", "Умение побеждать в спорах"],
        corr: 0,
        facts: "Разбор: Патриотизм — чувственное преданное отношение и любовь к Родине."
    },
    {
        q: "7. Как называется христианский храм?",
        opts: ["Мечеть", "Церковь (Церковь / Собор)", "Синагога", "Пагода"],
        corr: 1,
        facts: "Разбор: Богослужебным зданием в христианстве является церковь (храм, собор)."
    },
    {
        q: "8. Как называется молитвенный дом в исламе?",
        opts: ["Мечеть", "Дацан", "Кирха", "Костёл"],
        corr: 0,
        facts: "Разбор: Мечеть — мусульманское молитвенное архитектурное сооружение."
    },
    {
        q: "9. Какое качество помогает прощать ошибки других людей?",
        opts: ["Эгоизм", "Милосердие и великодушие", "Хвастовство", "Упрямство"],
        corr: 1,
        facts: "Разбор: Милосердие позволяет сочувствовать людям и уметь прощать их проступки."
    },
    {
        q: "10. Как называется готовность бескорыстно помогать другим людям?",
        opts: ["Альтруизм (бескорыстие)", "Жадность", "Зависть", "Равнодушие"],
        corr: 0,
        facts: "Разбор: Бескорыстная забота о благе других называется альтруизмом или добротой."
    },
    {
        q: "11. Что означает слово «этика»?",
        opts: ["Учение о правилах поведения и морали", "Наука о природе", "Искусство рисования", "История войн"],
        corr: 0,
        facts: "Разбор: Этика — это филофско-гуманитарная дисциплина, изучающая мораль и нравственность."
    },
    {
        q: "12. Как называется молитвенное сооружение в иудаизме?",
        opts: ["Синагога", "Мечеть", "Храм", "Пагода"],
        corr: 0,
        facts: "Разбор: Синагога — еврейский молитвенный дом."
    },
    {
        q: "13. Какое событие празднуют христиане на Пасху?",
        opts: ["Рождество", "Воскресение Иисуса Христа", "Новый год", "Троицу"],
        corr: 1,
        facts: "Разбор: Пасха — главный праздник христиан, посвященный Воскресению Христову."
    },
    {
        q: "14. Как называется буддийский монастырь или храм в России?",
        opts: ["Дацан", "Мечеть", "Собор", "Синагога"],
        corr: 0,
        facts: "Разбор: Дацан — буддийский монастырь-университет у бурят и калмыков в России."
    },
    {
        q: "15. Что из перечисленного относится к моральным качествам человека?",
        opts: ["Честность и доброта", "Высокий рост", "Цвет глаз", "Умение быстро бегать"],
        corr: 0,
        facts: "Разбор: Честность, доброта, уважение и ответственность — это моральные черты личности."
    },
    {
        q: "16. Как называется священная книга иудаизма?",
        opts: ["Тора (Танах)", "Коран", "Трипитака", "Евангелие"],
        corr: 0,
        facts: "Разбор: Первые пять книг Танаха (Пятикнижие Моисеево) называют Торой."
    },
    {
        q: "17. Какой важный пост соблюдают мусульмане в месяц Рамадан?",
        opts: ["Ураза", "Великий пост", "Донкод", "Песах"],
        corr: 0,
        facts: "Разбор: В месяц Рамадан мусульмане соблюдают обязательный пост — Уразу."
    },
    {
        q: "18. Как называется основатель буддизма?",
        opts: ["Сиддхартха Гаутама (Будда)", "Моисей", "Мухаммад", "Конфуций"],
        corr: 0,
        facts: "Разбор: Основателем буддизма является духовный учитель Сиддхартха Гаутама."
    },
    {
        q: "19. Что такое «этикет»?",
        opts: ["Правила поведения людей в обществе", "Вид спорта", "Кулинарный рецепт", "Раздел математики"],
        corr: 0,
        facts: "Разбор: Этикет — это установленный порядок поведения в обществе."
    },
    {
        q: "20. Какое отношение к людям старшего поколения считается нравственной нормой?",
        opts: ["Уважение и забота", "Равнодушие", "Пренебрежение", "Зависть"],
        corr: 0,
        facts: "Разбор: Уважение и всесторонняя помощь старшим — важнейшая нравственная норма любого общества."
    },
    {
        q: "21. Что является главным символом христианства?",
        opts: ["Крест", "Полумесяц", "Колесо Учения", "Звезда Давида"],
        corr: 0,
        facts: "Разбор: Крест — священный символ христианской веры."
    },
    {
        q: "22. Какой символ связывают с исламом?",
        opts: ["Полумесяц со звездой", "Крест", "Лотос", "Шестиконечная звезда"],
        corr: 0,
        facts: "Разбор: Полумесяц и звезда традиционно символизируют исламскую культуру."
    },
    {
        q: "23. Что такое «родственные связи» и «семья» в традиционной культуре России?",
        opts: ["Основа общества и поддержка человека", "Временное явление", "Необязательная часть жизни", "Дело каждого человека в отдельности"],
        corr: 0,
        facts: "Разбор: Семья — хранитель традиционных ценностей и духовная опора каждого человека."
    },
    {
        q: "24. Что означает понятии «светская этика»?",
        opts: ["Правила морали, основанные на гражданских представлениях о добре и зле, а не на религии", "Правила поведения в театре", "Правила поведения на балу", "Правила военной службы"],
        corr: 0,
        facts: "Разбор: Светская этика предлагает внерелигиозные нормы поведения человека на основе разума и гуманизма."
    },
    {
        q: "25. Какое качество помогает признать свою ошибку и извиниться?",
        opts: ["Мужество и честность", "Гордыня", "Струсость", "Упрямство"],
        corr: 0,
        facts: "Разбор: Честный и смелый человек способен открыто признать свою ошибку."
    },
    {
        q: "26. Как называется чувство благодарности за сделанное добро?",
        opts: ["Признательность", "Зависть", "Обида", "Злость"],
        corr: 0,
        facts: "Разбор: Благодарность и признательность — отклик на оказанное вам благо."
    },
    {
        q: "27. Что такое «духовные ценности»?",
        opts: ["Доброта, честность, любовь, дружба, верность", "Деньги и машины", "Красивая одежда", "Дорогой телефон"],
        corr: 0,
        facts: "Разбор: Духовные ценности — это морально-нравственные ориентиры человека."
    },
    {
        q: "28. Какой праздник объединяет людей всех национальностей и вероисповеданий в России?",
        opts: ["День Победы", "Масленица", "Сабантуй", "Навруз"],
        corr: 0,
        facts: "Разбор: День Победы (9 Мая) — общенациональный святой праздник для всех народов России."
    },
    {
        q: "29. Что означает слово «толерантность» (терпимость)?",
        opts: ["Уважение к чужой культуре, вероисповеданию и мнению", "Безразличие ко всему", "Отказ от своих взглядов", "Согласие со всеми"],
        corr: 0,
        facts: "Разбор: Толерантность — это уважение, принятие и правильное понимание богатого разнообразия культур нашего мира."
    },
    {
        q: "30. Какое из этих действий является примером бескорыстного доброго поступка?",
        opts: ["Помочь пожилому человеку перейти дорогу просто так", "Сделать уборку только за деньги", "Поделиться игрушкой взамен на угощение", "Выполнить обещание за подарок"],
        corr: 0,
        facts: "Разбор: Бескорыстный добрый поступок совершается от чистого сердца, не требуя никакой награды."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично знаем основы морали и культуры! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
