<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест по математике — 4 класс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f0fe;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 16px;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: #1a73e8;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 10px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-btn:active:not(:disabled) {
            background-color: #e8eaed;
        }

        .option-btn.correct {
            background-color: #c6e7ce !important;
            border-color: #34a853 !important;
            color: #0d652d !important;
        }

        .option-btn.wrong {
            background-color: #f4c7c3 !important;
            border-color: #ea4335 !important;
            color: #a50e0e !important;
        }

        .result-box {
            display: none;
            background-color: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px 8px 8px 4px;
            font-size: 16px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 24px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-prev {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: #1a73e8;
            color: #ffffff;
            display: none;
        }

        /* Финальный экран */
        .final-screen {
            display: none;
            text-align: center;
        }

        .final-title {
            font-size: 24px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e8eaed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            transition: width 0.5s ease;
        }

        .score-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a73e8;
        }

        .feedback-text {
            font-size: 18px;
            line-height: 1.5;
            color: #3c4043;
            margin-bottom: 28px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restart-btn {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            background-color: #34a853;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div id="quiz-screen">
        <div class="header" id="question-counter">Вопрос 1 из 30</div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
        <div class="result-box" id="result-box"></div>
        <div class="nav-footer">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="goPrev()">← Назад</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="goNext()">Дальше →</button>
        </div>
    </div>

    <div class="final-screen" id="final-screen">
        <div class="final-title">Результаты квеста</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="score-text" id="score-text"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="action-buttons">
            <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
            <button class="home-btn" id="home-btn" onclick="goHome()">На главную 🏠</button>
        </div>
    </div>
</div>

<script>
var questions = [
    {
        q: "1. Чему равно произведение чисел 120 и 5?",
        opts: ["500", "600", "650", "550"],
        corr: 1,
        facts: "Разбор: 120 × 5 = (100 × 5) + (20 × 5) = 500 + 100 = 600."
    },
    {
        q: "2. Найдите периметр прямоугольника со сторонами 8 см и 5 см:",
        opts: ["13 см", "26 см", "40 см", "30 см"],
        corr: 1,
        facts: "Разбор: Периметр P = (a + b) × 2 = (8 + 5) × 2 = 13 × 2 = 26 см."
    },
    {
        q: "3. Найдите площадь квадрата со стороной 7 см:",
        opts: ["28 см²", "49 см²", "14 см²", "35 см²"],
        corr: 1,
        facts: "Разбор: Площадь квадрата S = a × a = 7 × 7 = 49 см²."
    },
    {
        q: "4. Сколько минут в 3 часах 15 минутах?",
        opts: ["180 мин", "195 мин", "215 мин", "165 мин"],
        corr: 1,
        facts: "Разбор: 1 час = 60 мин. 3 часа = 3 × 60 = 180 мин. 180 + 15 = 195 мин."
    },
    {
        q: "5. Вычислите: 4500 : 90 =",
        opts: ["500", "5", "50", "5000"],
        corr: 2,
        facts: "Разбор: Зачеркиваем по одному нулю в делимом и делителе: 450 : 9 = 50."
    },
    {
        q: "6. Чему равен частное чисел 840 и 4?",
        opts: ["210", "220", "200", "240"],
        corr: 0,
        facts: "Разбор: 840 : 4 = 800 : 4 + 40 : 4 = 200 + 10 = 210."
    },
    {
        q: "7. Какое число нужно добавить к 780, чтобы получить 1000?",
        opts: ["120", "220", "320", "280"],
        corr: 1,
        facts: "Разбор: 1000 - 780 = 220."
    },
    {
        q: "8. Поезд проехал 240 км за 3 часа. С какой скоростью двигался поезд?",
        opts: ["70 км/ч", "80 км/ч", "90 км/ч", "60 км/ч"],
        corr: 1,
        facts: "Разбор: Скорость v = S : t = 240 : 3 = 80 км/ч."
    },
    {
        q: "9. Укажите число, в котором 5 сотен, 0 десятков и 8 единиц:",
        opts: ["580", "508", "805", "58"],
        corr: 1,
        facts: "Разбор: 5 сотен = 500, 0 десятков = 0, 8 единиц = 8. Число: 508."
    },
    {
        q: "10. Вычислите значение выражения: (30 + 20) × 6 =",
        opts: ["150", "200", "300", "250"],
        corr: 2,
        facts: "Разбор: Сначала действие в скобках: 30 + 20 = 50. Затем умножение: 50 × 6 = 300."
    },
    {
        q: "11. В одном сантиметре сколько миллиметров?",
        opts: ["100 мм", "10 мм", "1000 мм", "5 мм"],
        corr: 1,
        facts: "Разбор: 1 см = 10 мм."
    },
    {
        q: "12. Чему равна треть от числа 90?",
        opts: ["20", "30", "45", "15"],
        corr: 1,
        facts: "Разбор: Треть — это деление на 3. 90 : 3 = 30."
    },
    {
        q: "13. Какое остаток получится при делении 38 на 5?",
        opts: ["1", "2", "3", "4"],
        corr: 2,
        facts: "Разбор: Ближайшее меньшее число, делящееся на 5 — это 35. 38 - 35 = 3 (остаток)."
    },
    {
        q: "14. Маша купила 4 тетради по 15 рублей каждая. Сколько денег она заплатила?",
        opts: ["45 руб", "50 руб", "60 руб", "75 руб"],
        corr: 2,
        facts: "Разбор: Стоимость = цена × количество = 15 × 4 = 60 рублей."
    },
    {
        q: "15. Чему равен размах чисел: 120, 250, 400?",
        opts: ["280", "150", "250", "300"],
        corr: 0,
        facts: "Разбор: Размах — это разница между наибольшим и наименьшим значением: 400 - 120 = 280."
    },
    {
        q: "16. Вычислите: 700 - 340 =",
        opts: ["360", "460", "340", "380"],
        corr: 0,
        facts: "Разбор: 700 - 300 = 400; 400 - 40 = 360."
    },
    {
        q: "17. Сколько килограммов в 4 тоннах?",
        opts: ["400 кг", "4000 кг", "40000 кг", "40 кг"],
        corr: 1,
        facts: "Разбор: 1 тонна = 1000 кг. Следовательно, 4 тонны = 4000 кг."
    },
    {
        q: "18. Решите уравнение: x + 150 = 400. Чему равен x?",
        opts: ["350", "250", "200", "300"],
        corr: 1,
        facts: "Разбор: Чтобы найти неизвестное слагаемое, нужно из суммы вычесть известное слагаемое: x = 400 - 150 = 250."
    },
    {
        q: "19. Сколько сторон у шестиугольника?",
        opts: ["4", "5", "6", "8"],
        corr: 2,
        facts: "Разбор: У шестиугольника ровно 6 сторон и 6 углов."
    },
    {
        q: "20. Найдите половину от числа 500:",
        opts: ["200", "250", "300", "150"],
        corr: 1,
        facts: "Разбор: Половина — это деление на 2. 500 : 2 = 250."
    },
    {
        q: "21. Какое число является наибольшим?",
        opts: ["9899", "9909", "9990", "9099"],
        corr: 2,
        facts: "Разбор: Сравниваем поразрядно: 9990 больше всех остальных представленных чисел."
    },
    {
        q: "22. Вычислите: 16 × 5 =",
        opts: ["70", "80", "90", "85"],
        corr: 1,
        facts: "Разбор: 16 × 5 = (10 × 5) + (6 × 5) = 50 + 30 = 80."
    },
    {
        q: "23. Турист прошёл 15 км со скоростью 5 км/ч. Сколько времени он потратил?",
        opts: ["2 часа", "3 часа", "4 часа", "5 часов"],
        corr: 1,
        facts: "Разбор: Время t = S : v = 15 : 5 = 3 часа."
    },
    {
        q: "24. Увеличьте число 70 в 8 раз:",
        opts: ["560", "540", "490", "640"],
        corr: 0,
        facts: "Разбор: Увеличить В несколько раз — это умножение: 70 × 8 = 560."
    },
    {
        q: "25. Уменьшите число 360 на 90:",
        opts: ["250", "270", "280", "260"],
        corr: 1,
        facts: "Разбор: Уменьшить НА несколько единиц — это вычитание: 360 - 90 = 270."
    },
    {
        q: "26. Какой угол образуют стрелки часов в 3:00?",
        opts: ["Острый", "Прямой", "Тупой", "Развернутый"],
        corr: 1,
        facts: "Разбор: В 3 часа часовая стрелка указывает на 3, а минутная на 12. Это прямой угол (90°)."
    },
    {
        q: "27. Вычислите: 0 × 345 + 1 =",
        opts: ["346", "345", "1", "0"],
        corr: 2,
        facts: "Разбор: При умножении любого числа на 0 получается 0. Затем 0 + 1 = 1."
    },
    {
        q: "28. Сколько квадратных метров в 1 аре (сотке)?",
        opts: ["10 м²", "100 м²", "1000 м²", "60 м²"],
        corr: 1,
        facts: "Разбор: 1 ар (сотка) равен площади квадрата со стороной 10 м, т. е. 10 × 10 = 100 м²."
    },
    {
        q: "29. Чему равна сумма углов треугольника?",
        opts: ["90°", "180°", "360°", "270°"],
        corr: 1,
        facts: "Разбор: Сумма всех внутренних углов любого треугольника всегда равна 180°."
    },
    {
        q: "30. В классе 28 учеников. Девочки составляют половину. Сколько в классе мальчиков?",
        opts: ["12", "14", "16", "10"],
        corr: 1,
        facts: "Разбор: 28 : 2 = 14 девочек. Значит, мальчиков тоже 28 - 14 = 14."
    }
];

var currentIndex = 0;
var userAnswers = new Array(questions.length).fill(null);

function renderQuestion() {
    var item = questions[currentIndex];
    
    document.getElementById("question-counter").innerText = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
    document.getElementById("question-text").innerText = item.q;
    
    var container = document.getElementById("options-container");
    container.innerHTML = "";
    
    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "none";
    resultBox.innerText = "";
    
    var btnNext = document.getElementById("btn-next");
    btnNext.style.display = "none";
    
    var btnPrev = document.getElementById("btn-prev");
    btnPrev.disabled = (currentIndex === 0);
    
    var answered = userAnswers[currentIndex] !== null;
    
    for (var i = 0; i < item.opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = item.opts[i];
        btn.setAttribute("data-index", i);
        
        if (answered) {
            btn.disabled = true;
            var selectedIndex = userAnswers[currentIndex];
            if (i === item.corr) {
                btn.classList.add("correct");
            }
            if (i === selectedIndex && selectedIndex !== item.corr) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute("data-index"), 10);
                selectAnswer(idx);
            };
        }
        
        container.appendChild(btn);
    }
    
    if (answered) {
        resultBox.innerText = item.facts;
        resultBox.style.display = "block";
        btnNext.style.display = "inline-block";
    }
}

function selectAnswer(selectedIndex) {
    var item = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    
    var buttons = document.querySelectorAll("#options-container .option-btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === item.corr) {
            buttons[i].classList.add("correct");
        }
        if (i === selectedIndex && selectedIndex !== item.corr) {
            buttons[i].classList.add("wrong");
        }
    }
    
    var resultBox = document.getElementById("result-box");
    resultBox.innerText = item.facts;
    resultBox.style.display = "block";
    
    document.getElementById("btn-next").style.display = "inline-block";
}

function goNext() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showFinalScreen();
    }
}

function goPrev() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function showFinalScreen() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    
    var correctCount = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] === questions[i].corr) {
            correctCount++;
        }
    }
    
    var percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById("progress-bar-fill").style.width = percent + "%";
    document.getElementById("score-text").innerText = "Правильных ответов: " + correctCount + " из " + questions.length;
    
    var feedbackText = "";
    var homeBtn = document.getElementById("home-btn");

    if (correctCount === questions.length) {
        feedbackText = "Выполнено на 100%! Ты отлично считаешь и знаешь математику! Поздравляем!";
        homeBtn.style.display = "inline-block";
    } else {
        feedbackText = "Квест пройден на " + percent + "%. Чтобы перейти к выбору следующих предметов, необходимо пройти этот тест на 100%. Нажми «Пройти заново» и исправь ошибки!";
        homeBtn.style.display = "none";
    }
    
    document.getElementById("feedback-text").innerText = feedbackText;
}

function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    document.getElementById("home-btn").style.display = "none";
    document.getElementById("final-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    renderQuestion();
}

function goHome() {
    window.location.href = "index.html";
}

window.onload = function() {
    renderQuestion();
};
</script>

</body>
</html>
